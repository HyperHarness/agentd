    const slides=[{"title": "让模型并行，让结果可信", "section": "需求与架构报告", "notes": "这份报告回答三个问题：agentd 要满足什么需求，系统如何组织，以及为什么选择这样的架构。当前项目是从零重写的需求与候选设计资料包，包含可执行接口契约，但没有新业务服务的实现。\n\n建议用法：时间有限时看第 1–6 页，约 3–5 分钟；需要评审时继续第 7–30 页；需求追踪、参数候选、历史教训和文件索引在第 31–36 页。PowerPoint 每页包含讲解备注，离线网页版按 N 可展开同一讲解。\n\n报告中的产品要求、待评审机制、待验证假设和待选择参数保持原文状态；界面图、任务故事和统计数据算例明确标为示意。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 19, "short": "需求 §1–2"}, {"path": "docs/SOFTWARE_ARCHITECTURE_PROPOSAL.md", "line": 1, "short": "架构总览"}, {"path": "specs/agentd_v1/README.md", "line": 1, "short": "契约状态"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"让模型并行，让结果可信\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"132\" width=\"347.0\" height=\"35\" rx=\"17\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"158.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"21\" font-weight=\"700\">可信用户 · 本机 · 多模型开发协作<\/text><text x=\"80.00\" y=\"309.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"78\" font-weight=\"700\">让模型并行，<\/text><text x=\"80.00\" y=\"414.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"78\" font-weight=\"700\">让结果可信。<\/text><text x=\"84.00\" y=\"501.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"400\">agentd 从零重写：需求、架构与设计取舍<\/text><text x=\"84.00\" y=\"571.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"400\">把任务交出去，把判决和进度留得住。<\/text><rect x=\"1050\" y=\"224\" width=\"220\" height=\"115\" rx=\"18\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1075.00\" y=\"276.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">主线<\/text><text x=\"1075.00\" y=\"315.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">定义目标<\/text><rect x=\"1265\" y=\"364\" width=\"220\" height=\"115\" rx=\"18\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1290.00\" y=\"416.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">worker<\/text><text x=\"1290.00\" y=\"455.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">并行执行<\/text><rect x=\"1050\" y=\"504\" width=\"220\" height=\"115\" rx=\"18\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1075.00\" y=\"556.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">独审<\/text><text x=\"1075.00\" y=\"595.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">判断成果<\/text><line x1=\"1160\" y1=\"340\" x2=\"1340\" y2=\"360\" stroke=\"#F1C887\" stroke-width=\"3\"/><polygon points=\"1340.00,360.00 1328.68,363.99 1329.84,353.62\" fill=\"#F1C887\"/><line x1=\"1340\" y1=\"480\" x2=\"1160\" y2=\"500\" stroke=\"#F1C887\" stroke-width=\"3\"/><polygon points=\"1160.00,500.00 1170.16,493.62 1171.32,503.99\" fill=\"#F1C887\"/><line x1=\"1030\" y1=\"558\" x2=\"980\" y2=\"558\" stroke=\"#ABC8BE\" stroke-width=\"2\"/><line x1=\"980\" y1=\"558\" x2=\"980\" y2=\"280\" stroke=\"#ABC8BE\" stroke-width=\"2\"/><line x1=\"980\" y1=\"280\" x2=\"1038\" y2=\"280\" stroke=\"#ABC8BE\" stroke-width=\"2\"/><polygon points=\"1038.00,280.00 1027.19,285.22 1027.19,274.78\" fill=\"#ABC8BE\"/><rect x=\"80\" y=\"683\" width=\"1440\" height=\"112\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"106.00\" y=\"732.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">01–06  快速概览<\/text><text x=\"586.00\" y=\"732.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">07–30  需求与架构<\/text><text x=\"1106.00\" y=\"732.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">31–36  证据附录<\/text><text x=\"106.00\" y=\"773.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"22\" font-weight=\"400\">先抓住结论，再按问题深入。当前：候选设计与契约；新服务尚未实施。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  需求与架构报告<\/text><rect x=\"1321.0\" y=\"35\" width=\"199.0\" height=\"33\" rx=\"8\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1333.00\" y=\"56.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">设计快照 · 2026-10-28<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#1D4244\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：需求 §1–2；架构总览；契约状态<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">01 / 36<\/text><\/svg>"}, {"title": "60 秒：这个项目要交付什么", "section": "快速概览", "notes": "目标有三个：提高并行吞吐，让合适的任务使用能力或成本较低的模型，并逐步积累按难度分配模型的依据。主线 Codex 负责拆任务、写验收、预先评难度；agentd 从用户配置的固定 worker 池选择执行者；Claude Code 保留原生工具循环；独立 Codex reviewer 给出有效判决。\n\n业务终点很明确：PASS 就成功，累计三个有效 REJECT 就审核失败。主线是否采用或合并成果在这一闭环之外。系统同时保存可恢复进度和不可变成果，避免把客户端关闭或进程中断当作成果消失。\n\n三个目标目前仍是目标。已有文档和契约检查可以证明设计资料具有可核对结构，不能证明实际提速、省钱或学习策略优于随机。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 19, "short": "需求 §1–2"}, {"path": "specs/agentd_v1/README.md", "line": 57, "short": "契约证明边界"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"60 秒：这个项目要交付什么\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"245\" width=\"464\" height=\"225\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"325.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"65\" font-weight=\"700\">01<\/text><text x=\"104.00\" y=\"375.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">并行吞吐<\/text><text x=\"104.00\" y=\"423.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">让多个独立任务同时推进，减少串行<\/text><text x=\"104.00\" y=\"457.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">等待。<\/text><rect x=\"568\" y=\"245\" width=\"464\" height=\"225\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"592.00\" y=\"325.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"65\" font-weight=\"700\">02<\/text><text x=\"592.00\" y=\"375.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">合理用模<\/text><text x=\"592.00\" y=\"423.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">主线给难度，agentd 在固定池中选择<\/text><text x=\"592.00\" y=\"457.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">执行模型。<\/text><rect x=\"1056\" y=\"245\" width=\"464\" height=\"225\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1080.00\" y=\"325.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"65\" font-weight=\"700\">03<\/text><text x=\"1080.00\" y=\"375.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">持续学习<\/text><text x=\"1080.00\" y=\"423.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">按模型 × 难度积累结果，逐步形成分<\/text><text x=\"1080.00\" y=\"457.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">配偏好。<\/text><rect x=\"80\" y=\"505\" width=\"1440\" height=\"184\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"112.00\" y=\"564.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"35\" font-weight=\"700\">主线定义任务  →  原生 worker 执行  →  独立 reviewer 判决<\/text><text x=\"112.00\" y=\"628.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">agentd 贯穿全程：保存、调度、监督、重试边界、通知、统计。<\/text><rect x=\"80\" y=\"730\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"771.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">当前可确认：需求与候选契约已整理；产品收益仍需真实任务实验。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  快速概览<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">60 秒：这个项目要交付什么<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">一套可信本机上的任务协作系统，让模型团队持续交付可独审的成果。<\/text><rect x=\"1296.0\" y=\"35\" width=\"224.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1308.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 产品目标 / F · 当前状态<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：需求 §1–2；契约证明边界<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">02 / 36<\/text><\/svg>"}, {"title": "并行开工容易，可靠交付需要规则", "section": "快速概览", "notes": "用一个忙碌开发者的视角理解需求：主线把几项工作交给模型后，会继续做别的事情。回来时，最需要的不是一屏输出，而是知道谁完成了、依据是什么、哪个任务需要介入，以及已有进度是否还能继续。此页三个任务只用于说明，未声称发生过对应实验。\n\n如果把执行退出、任务通过和通知到达混在一起，系统会出现三个误判：进程退出零被当作合格成果；内存不足消耗模型审核机会；审核客户端离线被算成失败。共享文件或端口还可能让本来独立的任务互相干扰。\n\nagentd 的价值是把这些事实分开记录，在确定的业务合同和运行边界内推进，给主线一个可追溯的结果和可行动的等待原因。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 85, "short": "需求 F01–F17"}, {"path": "docs/design/DECISIONS_AND_EVIDENCE.md", "line": 22, "short": "历史教训 §1.2"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"并行开工容易，可靠交付需要规则\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"238\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">并行任务<\/text><text x=\"331.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">回来时看到的现象<\/text><text x=\"756.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">系统需要给出的确定答案<\/text><rect x=\"80\" y=\"291\" width=\"1440\" height=\"102\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"331.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">任务 A<\/text><text x=\"331.00\" y=\"331.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">worker 已退出<\/text><text x=\"756.00\" y=\"331.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">候选是否完整？独立审核是否通过？<\/text><rect x=\"80\" y=\"393\" width=\"1440\" height=\"102\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"433.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">任务 B<\/text><text x=\"331.00\" y=\"433.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">资源超限，运行中断<\/text><text x=\"756.00\" y=\"433.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">进度保存在哪里？旧进程停了吗？如何继续？<\/text><rect x=\"80\" y=\"495\" width=\"1440\" height=\"102\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"535.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">任务 C<\/text><text x=\"331.00\" y=\"535.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">成果已交，reviewer 离线<\/text><text x=\"756.00\" y=\"535.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">原候选是否仍在队列？谁来领取？是否误计拒绝？<\/text><rect x=\"80\" y=\"625\" width=\"700\" height=\"161\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"648\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"680.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">可见的价值<\/text><text x=\"105.00\" y=\"738.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">主线接回任务时，能直接作出下一步决定。<\/text><rect x=\"804\" y=\"625\" width=\"716\" height=\"161\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"804\" y=\"648\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"829.00\" y=\"680.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">隐含的工程责任<\/text><text x=\"829.00\" y=\"738.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">每次重启、重发和清理，都保持同一份业务事实。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  快速概览<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">并行开工容易，可靠交付需要规则<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">情境示意：三个任务同时开始，主线一段时间后再回来查看。<\/text><rect x=\"1322.0\" y=\"35\" width=\"198.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1334.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 需求动机 / 情境示意<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：需求 F01–F17；历史教训 §1.2<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">03 / 36<\/text><\/svg>"}, {"title": "六条规则，定义产品的性格", "section": "快速概览", "notes": "第一，主线给任务和难度，模型由 agentd 自动选择。第二，独立评审 PASS 立即成功，主线之后不用成果也不改这个事实。第三，最多三个被独立评审拒绝的有效候选；第三次拒绝就结束，没有第四次自动尝试。\n\n第四，网络、工具、资源和审核环境故障都不是有效 REJECT；有限自动恢复耗尽后保留任务并等待显式处置。第五，worker 保留原生 Claude Code 的工具、MCP、subagent、网络和会话能力，前提是原模型、账号和主机本来支持。第六，任务终态不可覆写，后续改变目标或发现缺陷时建立关联新任务。\n\n任务合同两阶段冻结、五个状态名称和具体租约算法是为这些边界服务的候选设计，见后面的 D 页面。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 27, "short": "需求 §2"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 65, "short": "任务终点 §4"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 260, "short": "不可降低的边界"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"六条规则，定义产品的性格\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"238\" width=\"464\" height=\"253\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"261\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"292.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">主线给难度<\/text><text x=\"105.00\" y=\"353.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">模型选择由 agentd 完成。<\/text><rect x=\"568\" y=\"238\" width=\"464\" height=\"253\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"568\" y=\"261\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"593.00\" y=\"292.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">PASS 即成功<\/text><text x=\"593.00\" y=\"353.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">无需追加采纳或合并关卡。<\/text><rect x=\"1056\" y=\"238\" width=\"464\" height=\"253\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"1056\" y=\"261\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1081.00\" y=\"292.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">三次有效拒绝结束<\/text><text x=\"1081.00\" y=\"353.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">三拒绝后由主线重新规划。<\/text><rect x=\"80\" y=\"519\" width=\"464\" height=\"253\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"542\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#3C7398\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"573.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">故障保留接续能力<\/text><text x=\"105.00\" y=\"634.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">故障次数与审核拒绝分开记录。<\/text><rect x=\"568\" y=\"519\" width=\"464\" height=\"253\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"568\" y=\"542\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"593.00\" y=\"573.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">保留原生能力<\/text><text x=\"593.00\" y=\"634.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">MCP、subagent、shell 与会话<\/text><text x=\"593.00\" y=\"674.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">继续可用。<\/text><rect x=\"1056\" y=\"519\" width=\"464\" height=\"253\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"1056\" y=\"542\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1081.00\" y=\"573.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">终态留作历史事实<\/text><text x=\"1081.00\" y=\"634.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">修改目标或发现缺陷，建立关联<\/text><text x=\"1081.00\" y=\"674.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">新任务。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  快速概览<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">六条规则，定义产品的性格<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">后续架构都要服务于这些已确认边界。<\/text><rect x=\"1388.0\" y=\"35\" width=\"132.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1400.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 已确认要求<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：需求 §2；任务终点 §4；不可降低的边界<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">04 / 36<\/text><\/svg>"}, {"title": "一张图：谁思考，谁执行，谁保证过程", "section": "快速概览", "notes": "从上到下读：Dashboard 给用户配置和管理；主线和独立 reviewer 使用同一 bridge 的两个固定角色连接，经 HTTP 访问同一个后端。后端认证身份并执行业务用例，任务、调度、审核、通知和统计都在一个 daemon 中。\n\ndaemon 与宿主监督器协作派发受控 worker。每次执行有独立工作区、会话和本地后代资源组。SQLite 保存合同、状态、判决和索引；Git 与文件保存代码、报告和证据正文。\n\nU 是按需运行的生命周期执行器，位于服务 S 的停止边界之外，负责安装、升级和卸载；日常启停由服务管理器处理。主线和 reviewer 是外部客户端，不由 agentd 托管其账号或推理循环，也不在 worker 的资源预算内。图是职责视图，连线不代表一律是父子进程关系。", "sources": [{"path": "docs/SOFTWARE_ARCHITECTURE_PROPOSAL.md", "line": 37, "short": "系统组成与模块"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 5, "short": "统一运行拓扑"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"一张图：谁思考，谁执行，谁保证过程\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#10 事务事实与成果正文分开保存<\/text><text x=\"597.00\" y=\"676.60\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">共同组成可恢复的数据资产<\/text><rect x=\"1070\" y=\"553\" width=\"450\" height=\"138\" rx=\"14\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1092.00\" y=\"598.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">生命周期执行器 U<\/text><text x=\"1092.00\" y=\"643.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">S 停止后继续安装 / 升级 / 卸载<\/text><text x=\"1092.00\" y=\"676.60\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">独立操作记录与资源预算<\/text><line x1=\"1295\" y1=\"503\" x2=\"1295\" y2=\"550\" stroke=\"#F1C887\" stroke-width=\"2\" stroke-dasharray=\"8 6\"/><polygon points=\"1295.00,550.00 1289.78,539.19 1300.22,539.19\" fill=\"#F1C887\"/><text x=\"82.00\" y=\"771.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">主线负责业务选择   ·   worker 负责产出   ·   reviewer 负责判决   ·   agentd 负责可靠推进<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  快速概览<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">一张图：谁思考，谁执行，谁保证过程<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">所有入口共享同一业务 daemon、同一权威状态；U 独立承担生命周期操作。<\/text><rect x=\"1292.0\" y=\"35\" width=\"228.0\" height=\"33\" rx=\"8\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1304.00\" y=\"56.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 角色边界 / D · 结构方案<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#1D4244\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：系统组成与模块；统一运行拓扑<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">05 / 36<\/text><\/svg>"}, {"title": "交付路线：先跑通真实闭环，再补齐正式能力", "section": "快速概览", "notes": "当前仓库已有产品基线、架构总览、六个专题和契约源码。本次复核：29 个操作、153 个注册模型、8 个正例、19 个反例及 3 组拆分回归通过，生成物一致；新服务、模型和主机验收未运行。\n\nV0 建议限制为单用户、单主机、单项目和独立任务。要求三个真实 worker 重叠执行、至少两种模型、完整独审终态、保留进度与显式继续。模型仅随机分配，reviewer 主动领取，自动恢复可以为 0；安装由最小 U 完成，升级和卸载尚未交付。\n\nV1 再加入固定依赖 DAG、已验证的客户端提示、有限自动恢复、成熟样本下的能力偏好，以及受支持升级和保留数据卸载。不能把这些候选限制当作已经获得批准，也不能因有契约源码就认定 V0 合同已冻结。推进顺序是探针、合同、真实任务、故障与并行，再到 V1。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 243, "short": "V0 / V1 范围"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 25, "short": "工作包 A–E"}, {"path": "specs/agentd_v1/README.md", "line": 22, "short": "离线契约检查"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"交付路线：先跑通真实闭环，再补齐正式能力\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"238\" width=\"440\" height=\"400\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"261\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#3C7398\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"293.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">现在：可审阅的设计<\/text><text x=\"105.00\" y=\"353.00\" fill=\ SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">反馈与终态由 agentd 持久记录<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  业务闭环<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">跟随一条任务：从“请修复”到可读取成果<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">示例任务：为导出接口补充参数校验与测试；难度由主线事先给定。<\/text><rect x=\"1306.0\" y=\"35\" width=\"214.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1318.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 角色 / D · 流程 / 示例<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：角色责任；角色泳道；典型调用<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">07 / 36<\/text><\/svg>"}, {"title": "17 项核心需求，组成六块交付责任", "section": "需求地图", "notes": "此页把需求表压缩为六个便于评审的工作域，编号完整覆盖 F01–F17。任务域负责持久创建、调度与依赖；原生工作域确保实际工具可用、工作区独立并可复用明确版本的工具；运行保护域确保本地后代受预算约束，控制面和 U 的资源归属清楚。\n\n交付与独审域让代码或报告可取得、证据完整、三个有效拒绝闭环正确；故障与通知域让任务在客户端退出、执行中断和发送不确定时仍能被找到和接续；配置与运维域提供三个主要页面、固定 worker 池和有限生命周期保障。\n\n需求范围贯穿完整产品；V0/V1 的候选分期在第 6 页说明。附录第 32–33 页把每个编号进一步对应到机制和验收。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 85, "short": "核心需求 F01–F17"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 113, "short": "交付链补充验收"}], "svg": "<svg xmlns=\"http://w .00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">固定池、三个页面、安装升级卸载<\/text><text x=\"1081.00\" y=\"672.96\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">和失败保全。<\/text><rect x=\"1081\" y=\"730\" width=\"199.0\" height=\"35\" rx=\"17\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1097.00\" y=\"752.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"17\" font-weight=\"700\">F10 · F12 · F16 · F17<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  需求地图<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">17 项核心需求，组成六块交付责任<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">每一块都要给用户一个可观察的结果，而不是只完成内部组件。<\/text><rect x=\"1311.0\" y=\"35\" width=\"209.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1323.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">需求归纳 · 对应 F01–F17<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：核心需求 F01–F17；交付链补充验收<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">08 / 36<\/text><\/svg>"}, {"title": "五个业务阶段，配合真实执行观察", "section": "业务闭环", "notes": "候选状态表示只有 queued、running、reviewing、finished、canceled。queued 等输入和容量；派发预留后进入 running；执行闭合且候选发布通过校验后进入 reviewing；PASS 或第三次有效 REJECT 进入 finished，分别记录 passed 或 review_failed。第一、第二次拒绝回到 queued。\n\n运行中断保留 running，并用观察字段显示 interrupted、等待原因和可用动作，所以 running 并不等于还有活动 PID。审核离线或无法进行保留 reviewing，不增加 REJECT。取消先保存意图、撤销审核权限并阻止新执行，所有所属执行闭合后才进入 canceled。\n\n取消与判决在同一事务顺序中裁决：终态先提交则保留终态；取消意图先提交则拒绝迟到判决。finished 和 canceled 均不可重开。", "sources": [{"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 5, "short": "五阶段"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 5, "short": "状态组合与不变量"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"五个业务阶段，配合真实执行观察\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"257\" width=\"320\" height=\"143\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"309.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">queued<\/text><text x=\"102.00\" y=\"347.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">等待输入 / 容量<\/text><rect x=\"470\" y=\"257\" width=\"320\" height=\"143\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"492.00\" y=\"309.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">running<\/text><text x=\"492.00\" y=\"347.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">执行阶段<\/text><rect x=\"860\" y=\"257\" width=\"320\" height=\"143\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"882.00\" y=\"309.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">reviewing<\/text><text x=\"882.00\" y=\"347.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">冻结候选待独审<\/text><line x1=\"405\" y1=\"327\" x2=\"460\" y2=\"327\" stroke=\"#127C72\" stroke-width=\"3\"/><polygon points=\"460.00,327.00 449.19,332.22 449.19,321.78\" fill=\"#127C72\"/><line x1=\"795\" y1=\"327\" x2=\"850\" y2=\"327\" stroke=\"#3C7398\" stroke-width=\"3\"/><polygon points=\"850.00,327.00 839.19,332.22 839.19,321.78\" fill=\"#3C7398\"/><rect x=\"1230\" y=\"257\" width=\"290\" height=\"143\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1252.00\" y=\"307.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">finished<\/text><text x=\"1252.00\" y=\"347.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">passed /<\/text><text x=\"1252.00\" y=\"380.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">review_failed<\/text><line x1=\"1185\" y1=\"327\" x2=\"1220\" y2=\"327\" stroke=\"#127C72\" stroke-width=\"3\"/><polygon points=\"1220.00,327.00 1209.19,332.22 1209.19,321.78\" fill=\"#127C72\"/><text x=\"1101.50\" y=\"235.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"20\" font-weight=\"700\">PASS / 第 3 次拒绝<\/text><line x1=\"1020\" y1=\"403\" x2=\"1020\" y2=\"452\" stroke=\"#E76A3B\" stroke-width=\"2\"/><line x1=\"1020\" y1=\"452\" x2=\"240\" y2=\"452\" stroke=\"#E76A3B\" stroke-width=\"2\"/><line x1=\"240\" y1=\"452\" x2=\"240\" y2=\"405\" stroke=\"#E76A3B\" stroke-width=\"2\"/><polygon points=\"240.00,405.00 245.22,415.81 234.78,415.81\" fill=\"#E76A3B\"/><text x=\"344.50\" y=\"486.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">第 1 / 2 次有效 REJECT：沿用合同、输入与模型返修<\/text><rect x=\"80\" y=\"551\" width=\"690\" height=\"169\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"600.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">running / interrupted<\/text><text x=\"102.00\" y=\"641.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">示例：内存超限；进度已保存；等待资源调整与继续。<\/text><rect x=\"800\" y=\"551\" width=\"720\" height=\"169\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"822.00\" y=\"600.00\" fill=\"#B84F49\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">canceled<\/text><text x=\"822.00\" y=\"641.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">取消意图生效 → 停止与租约核对 → 取消完成。<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">界面同时呈现：业务阶段 + 执行观察 + 等待原因 + 当前可用动作。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  业务闭环<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">五个业务阶段，配合真实执行观察<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">业务阶段告诉你走到哪里；执行观察告诉你此刻发生了什么。<\/text><rect x=\"1292.0\" y=\"35\" width=\"228.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1304.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 状态表示 / R · 结束语义<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：五阶段；状态组合与不变量<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">09 / 36<\/text><\/svg>"}, {"title": "四种记录，避免把“重跑”误当成“又失败一次”", "section": "业务闭环", "notes": "Task 是一份不可变业务合同与最终结果。Execution 是一次可追踪的运行，有 launch_id、执行代次、进程身份、资源和闭合证据。Candidate 是一次不可变交付，包含代码 commit 或报告，以及完整证据和摘要。Review 是独立 reviewer 对精确候选作出的有效判决。\n\n示例：E1 因资源问题中断，没有候选；确认停止后 E2 接续，交付 C1，被有效拒绝；E3 返修交付 C2，审核通过。这里有 3 次执行、2 个候选、1 次有效拒绝、1 个最终成功任务。它只贡献一个 benchmark 任务样本。\n\n数据库约束保护每个 Task 和 worker 槽最多一个未闭合 Execution、每个 Candidate 最多一个生效 Review。执行身份未知时也算占位，不能仅因为看不到 PID 就启动第二份。", "sources": [{"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 147, "short": "核心对象"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 39, "short": "事务与唯一性约束"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"四种记录，避免把“重跑”误当成“又失败一次”\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"237\" width=\"340\" height=\"246\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"260\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"293.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">Task<\/text><text x=\"105.00\" y=\"350.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">约定要做什么<\/text><text x=\"105.00\" y=\"387.96\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">保存目标、验收与终态<\/text><rect x=\"444\" y=\"237\" width=\"340\" height=\"246\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"444\" y=\"260\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#3C7398\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"469.00\" y=\"293.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">Execution<\/text><text x=\"469.00\" y=\"350.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">记录一次怎样运行<\/text><text x=\"469.00\" y=\"387.96\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">保存进程、资源与闭合证<\/text><text x=\"469.00\" y=\"425.92\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">据<\/text><rect x=\"808\" y=\"237\" width=\"340\" height=\"246\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"808\" y=\"260\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"833.00\" y=\"293.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">Candidate<\/text><text x=\"833.00\" y=\"350.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">冻结一次交付内容<\/text><text x=\"833.00\" y=\"387.96\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">commit / 报告 / 证据<\/text><rect x=\"1172\" y=\"237\" width=\"340\" height=\"246\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"1172\" y=\"260\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1197.00\" y=\"293.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">Review<\/text><text x=\"1197.00\" y=\"350.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">绑定一次独立判决<\/text><text x=\"1197.00\" y=\"387.96\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">候选、身份、租约与依据<\/text><text x=\"80.00\" y=\"552.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">同一任务的示例时间线<\/text><rect x=\"80\" y=\"578\" width=\"300\" height=\"121\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"625.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">E1 中断<\/text><text x=\"102.00\" y=\"668.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">0 个候选<\/text><rect x=\"450\" y=\"578\" width=\"300\" height=\"121\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"472.00\" y=\"625.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">E2 → C1<\/text><text x=\"472.00\" y=\"668.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">REJECT × 1<\/text><rect x=\"820\" y=\"578\" width=\"300\" height=\"121\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"842.00\" y=\"625.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">E3 → C2<\/text><text x=\"842.00\" y=\"668.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">PASS<\/text><line x1=\"386\" y1=\"635\" x2=\"440\" y2=\"635\" stroke=\"#647874\" stroke-width=\"2\"/><polygon points=\"440.00,635.00 429.19,640.22 429.19,629.78\" fill=\"#647874\"/><line x1=\"756\" y1=\"635\" x2=\"810\" y2=\"635\" stroke=\"#647874\" stroke-width=\"2\"/><polygon points=\"810.00,635.00 799.19,640.22 799.19,629.78\" fill=\"#647874\"/><rect x=\"1195\" y=\"565\" width=\"325\" height=\"160\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1222.00\" y=\"614.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">统计只记 1 个任务<\/text><text x=\"1222.00\" y=\"661.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">3 次执行 ≠ 3 个样本<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">拆开运行与判决，才能让可恢复故障保持原有审核次数。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  业务闭环<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">四种记录，避免把“重跑”误当成“又失败一次”<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">一个 Task 可以有多次 Execution；只有有效审核判决才消耗审核机会。<\/text><rect x=\"1386.0\" y=\"35\" width=\"134.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1398.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 对象与关系<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：核心对象；事务与唯一性约束<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">10 / 36<\/text><\/svg>"}, {"title": "两次冻结：先锁定题目，再锁定具体材料", "section": "业务闭环", "notes": "提交成功时固定 TaskSpec：项目、目标、范围、成果、验收、难度、明确输入引用和依赖选择规则。主线不选模型；服务展开当时的项目默认值并固定版本。即使任务仍在 queued，也不能改合同。\n\n首次派发前再固定 ResolvedInputs：实际 base commit、上游最终通过 candidate_id、artifact 内容摘要、路径映射和保留引用；同时固定 Assignment 的模型与配置。输入准备可能较慢，完成后仍要重核暂停、取消、授权和资源容量。\n\n返修和恢复沿用这些精确输入，不重新解析 latest。上游失败使下游等待并说明原因，不能计作下游模型失败。上游 PASS 只说明候选通过审核，主线若要合并多个候选，应在流程外准备确定的 base 或另建整合任务。V0 仅独立任务且输入在提交时可取得，依赖 DAG 属 V1。", "sources": [{"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 167, "short": "输入冻结与依赖"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 65, "short": "任务合同"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"两次冻结：先锁定题目，再锁定具体材料\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"245\" width=\"650\" height=\"336\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"268\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"300.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">冻结 ①  提交时<\/text><text x=\"105.00\" y=\"360.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">TaskSpec<\/text><text x=\"105.00\" y=\"400.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">目标 / 范围 / 成果 / 验收 / 难度<\/text><text x=\"105.00\" y=\"441.76\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">明确输入与依赖选择规则<\/text><text x=\"105.00\" y=\"482.64\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">项目默认值和规则版本<\/text><rect x=\"105\" y=\"529\" width=\"134.0\" height=\"35\" rx=\"17\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"121.00\" y=\"551.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"17\" font-weight=\"700\">题目不再改变<\/text><rect x=\"870\" y=\"245\" width=\"650\" height=\"336\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"870\" y=\"268\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"895.00\" y=\"300.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">冻结 ②  首次派发前<\/text><text x=\"895.00\" y=\"360.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">ResolvedInputs + Assignment<\/text><text x=\"895.00\" y=\"400.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">实际 base commit / 上游候选<\/text><text x=\"895.00\" y=\"441.76\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">内容摘要与保留引用<\/text><text x=\"895.00\" y=\"482.64\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">绑定模型、worker 与固定配置<\/text><rect x=\"895\" y=\"529\" width=\"185.0\" height=\"35\" rx=\"17\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"911.00\" y=\"551.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"17\" font-weight=\"700\">材料与执行配置固定<\/text><line x1=\"744\" y1=\"402\" x2=\"855\" y2=\"402\" stroke=\"#127C72\" stroke-width=\"3\"/><polygon points=\"855.00,402.00 844.19,407.22 844.19,396.78\" fill=\"#127C72\"/><text x=\"752.00\" y=\"457.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">等待依赖<\/text><rect x=\"80\" y=\"614\" width=\"1440\" height=\"102\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"106.00\" y=\"662.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">上游 PASS<\/text><text x=\"340.00\" y=\"662.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">→ 下游读取精确候选；需要整合时，由主线显式准备新的确定 base。<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">调整目标、难度、验收或模型：建立关联新任务，保留原合同与结果。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  业务闭环<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">两次冻结：先锁定题目，再锁定具体材料<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">允许等待依赖，同时保证同一任务的返修始终回答同一个问题。<\/text><rect x=\"1310.0\" y=\"35\" width=\"210.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1322.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 双阶段冻结 / V1 依赖<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：输入冻结与依赖；任务合同<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">11 / 36<\/text><\/svg>"}, {"title": "模型分配从公平探索开始，再用足够证据形成偏好", "section": "调度与学习", "notes": "调度先过滤不可用、忙碌、禁用或不满足任务条件的槽位。冷启动不预设模型品牌强弱，建议先在拥有合格空闲 worker 的不同模型间等概率选择，再在该模型的合格 worker 内随机选槽，避免把槽位多误解为能力强。\n\n模型与难度组具有足够成熟、可比样本且差异达到预定门槛后，才启用能力偏好；样本不足继续随机，并保留随机探索与对照。难度量表、样本量、观察窗口、差异阈值、探索比例以及强模型忙时如何处理都仍待选择。\n\n首次绑定后，返修和恢复使用同一 worker_id、模型和固定配置。新统计影响后续未绑定的新任务。准入同时取得 worker 槽、预算和声明共享资源；没有合格容量就排队，每个 worker 同时最多一个未闭合执行。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 173, "short": "随机到能力偏好"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 198, "short": "成熟队列门槛"}, {"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 190, "short": "固定 worker 选择"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\" 3.00\" y=\"624.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"22\" font-weight=\"700\">模型 B：1 个空闲槽<\/text><text x=\"437.00\" y=\"576.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">建议冷启动<\/text><text x=\"437.00\" y=\"614.64\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">A / B 等概率<\/text><rect x=\"804\" y=\"459\" width=\"716\" height=\"247\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"804\" y=\"482\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"829.00\" y=\"514.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">何时允许学习路由？<\/text><text x=\"829.00\" y=\"574.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">同难度、同窗口、成熟样本足够；差异与可比性达到<\/text><text x=\"829.00\" y=\"614.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">预设门槛，保留随机探索。<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">槽位数量表达容量；模型偏好必须来自可比较的任务结果。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  调度与学习<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">模型分配从公平探索开始，再用足够证据形成偏好<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">用户配置固定 worker 池；主线只给难度；已绑定任务保持原模型。<\/text><rect x=\"1306.0\" y=\"35\" width=\"214.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1318.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 自动择模 / D·P · 策略<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：随机到能力偏好；成熟队列门槛；固定 worker 选择<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">12 / 36<\/text><\/svg>"}, {"title": "完成率可能好看，等待中的任务必须留在视野里", "section": "调度与学习", "notes": "审核结果完成率定义为 S/(S+R)，S 是最终通过的任务数，R 是三个有效拒绝后的失败任务数。取消和未结束单列；一个任务的三轮候选不能算三个样本。这个公式回答已经得到最终审核结果的任务表现如何。\n\n算例假设两个模型同难度、同观察窗口 H，且各有 10 个已走满窗口的首次分配任务。A 有 2 个在 H 内通过、0 个三轮失败、8 个在 H 时仍未结束；B 有 7 个在 H 内通过、3 个三轮失败。A 的结果完成率为 100%，但按期通过率只有 20%；B 两个值都是 70%。这说明仅按已结束比例排名可能奖励长期积压。\n\n成熟队列的按期通过率是 S_H/N，取消和未完成仍在分母，H 后通过不改写按期历史。产品层还要从提交时点建立队列纳入排队。算例不能证明 B 必然更强，真实启用偏好仍需样本、差异、故障比例和随机对照等门槛。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 160, "short": "审核结果完成率"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 198, "short": "固定窗口队列"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"完成率可能好看，等待中的任务必须留在视野里\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"240\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"273.00\" fill=\"#FFFF  y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：审核结果完成率；固定窗口队列<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">13 / 36<\/text><\/svg>"}, {"title": "一个 daemon，按“谁拥有事实”拆成深模块", "section": "逻辑架构", "notes": "单 daemon 是本机部署与事务一致性的候选选择，不等于把所有代码塞进一个类。任务服务拥有 TaskSpec、阶段、首次分配、拒绝计数和终态；调度执行拥有选择、预留和运行观察；候选审核拥有冻结候选、租约与判决绑定；成果存储拥有摘要、引用、保留和回收；接入配置拥有项目、固定配置与身份；通知查询拥有队列、投影和可重建统计；平台适配拥有资源组、worktree 与服务接口。\n\n应用用例持有 UnitOfWork，各模块通过受限接口参与同一事务，不各自 commit，也不经 HTTP 调另一个本机模块完成原子动作。审核判决必须连同拒绝计数、任务阶段、成果引用、事件和 outbox 一起提交。\n\nGit、文件复制、hash 和进程调用属于慢外部操作，在写事务外做有界准备，提交前重新核验相关状态；因此单服务仍然需要明确的恢复与对账协议。", "sources": [{"path": "docs/SOFTWARE_ARCHITECTURE_PROPOSAL.md", "line": 54, "short": "模块所有权"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 39, "short": "跨模块事务所有者"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"一个 daemon，按“谁拥有事实”拆成深模块\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"238\" width=\"464\" height=\"145\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"286.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">任务服务<\/text><text x=\"102.00\" y=\"328.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">合同 / 阶段 / 终态<\/text><rect x=\"568\" y=\"238\" width=\"464\" height=\"145\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"590.00\" y=\"286.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">调度与执行<\/text><text x=\"590 Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">队列 / 投影 / 统计<\/text><rect x=\"80\" y=\"596\" width=\"1440\" height=\"76\" rx=\"14\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"107.00\" y=\"644.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">平台适配：监督器 / 资源组 / 工作区 / 服务管理器 / U 接口<\/text><rect x=\"80\" y=\"701\" width=\"1440\" height=\"106\" rx=\"14\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"106.00\" y=\"747.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">审核提交 = 判决 + 次数 + 终态 + 成果引用 + 事件 / outbox<\/text><text x=\"106.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">由同一应用用例原子提交；统计从已提交事实重建。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  逻辑架构<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">一个 daemon，按“谁拥有事实”拆成深模块<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">外部接口保持简单；跨模块不变量由应用用例的一次短事务完成。<\/text><rect x=\"1386.0\" y=\"35\" width=\"134.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1398.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 模块与事务<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：模块所有权；跨模块事务所有者<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">14 / 36<\/text><\/svg>"}, {"title": "契约先行：三个入口使用同一种业务语言", "section": "逻辑架构", "notes": "现有可执行设计契约分工清晰：models.py 定义严格请求响应类型、跨字段约束和候选参数；operations.py 定义方法路径、角色、错误、幂等与 CLI/MCP 映射；generate.py 导出 OpenAPI、JSON Schema 和 API_REFERENCE；check.py 检查生成物、引用、样例和反例。生成文件不手工改。\n\n本次复核 29 个操作，其中 B01–B16 为业务及适配操作，M01–M13 为管理、会话和健康操作；B16 续租只供适配器，不是模型工具。153 个注册模型不等于 153 个 API。协议 /v1 表示拟定 HTTP 主版本，目前具体化的是产品 V0。\n\n写操作使用 request_key 幂等，配置使用 expected_version 检测竞争；202 表示意图被持久接受，任务结果另查。角色、权限、进程和事务仍必须由真实后端验证。合同代码没有生成服务 handler、数据库模型或前端业务实现。", "sources": [{"path": "specs/agentd_v1/README.md", "line": 7, "short": "契约文件分工"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 177, "short": "API 合同规则"}, {"path": "specs/agentd_v1/operations.py", "line": 93, "short": "操作注册表"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"契约先行：三个入口使用同一种业务语言\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"246\" width=\"540\" height=\"175\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"295.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">models.py + operations.py<\/text><text x=\"102.00\" y=\"336.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">严格字段 / 传输映射 / 角色 / 错误<\/text><text x=\"102.00\" y=\"369.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">幂等 / 前置条件 / 客户端映射<\/text><line x1=\"632\" y1=\"332\" x2=\"706\" y2=\"332\" stroke=\"#127C72\" stroke-width=\"3\ " font-size=\"28\" font-weight=\"700\">reviewer CLI / MCP<\/text><text x=\"1078.00\" y=\"560.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">next / evidence / submit / defer<\/text><rect x=\"80\" y=\"669\" width=\"1440\" height=\"138\" rx=\"16\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"107.00\" y=\"725.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"36\" font-weight=\"700\">29 个操作<\/text><text x=\"480.00\" y=\"725.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"36\" font-weight=\"700\">153 个注册模型<\/text><text x=\"1040.00\" y=\"725.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"36\" font-weight=\"700\">离线检查 PASS<\/text><text x=\"108.00\" y=\"780.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">覆盖候选结构与一致性；真实鉴权、事务、主机隔离与模型表现仍待验收。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  逻辑架构<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">契约先行：三个入口使用同一种业务语言<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">字段与路由各有唯一来源，页面、CLI、MCP 按同一行为合同接入。<\/text><rect x=\"1296.0\" y=\"35\" width=\"224.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1308.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 接口先行 / F · 候选契约<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：契约文件分工；API 合同规则；操作注册表<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">15 / 36<\/text><\/svg>"}, {"title": "三个主页面，让忙碌用户先看到“下一步”", "section": "使用体验", "notes": "用户主要需要三个视角。总览与任务展示阶段、实际执行、审核轮次、等待原因和下一动作，详情及简单统计作为面板。Worker 配置管理数量、relay、模型参数、凭据来源、资源和固定配置版本，并明确配置变化影响新任务还是后续执行。服务管理展示版本、维护状态和本地操作记录。\n\nV0 服务管理仅提供状态和本地维护说明，升级和保留数据卸载按钮属于 V1。本页 UI 只是一种说明布局，未代表前端已开发或固定视觉要求。\n\n前端不自行推断任务结果或权限。后端返回动作和禁止原因，点击时再次检查。断线、无权、过期快照和空结果必须区别；保存后丢响应使用原 request_key 查回，不能盲重放。暂停新增派发不会停止活动 worker，取消也不是暂停。", "sources": [{"path": "docs/design/INTERFACE_GUIDE.md", "line": 137, "short": "三个主页面"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 154, "short": "交互合同"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 172, "short": "配置生效范围"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"三个主页面，让忙碌用户先看到“下一步”\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"236\" width=\"464\" height=\"485\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"#D6DED6\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"236\" width=\"464\" height=\"66\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"278\" width=\"464\" height=\"24\" rx=\"0\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"103.00\" y=\"280.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">总览与任务<\/text><rect x=\"568\" y=\"236\" width=\"464\" height=\"485\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"#D6DED6\" stroke-width=\"1.5\"/><rect x=\"5 th=\"1.5\"/><text x=\"1304.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 页面范围 / D · 交互示意<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：三个主页面；交互合同；配置生效范围<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">16 / 36<\/text><\/svg>"}, {"title": "同一个用户，也需要清楚的角色边界", "section": "接入与权限", "notes": "同一个人既是业务负责人，也可能是平台管理员，但主线任务权限不自动等于管理权限。Dashboard 管理身份配置 worker 和角色；主线提交、查询、继续和取消项目任务；reviewer 领取候选、保存自己的证据和提交独立判决；worker 通过专属交付通道产出候选。管理员也不能用 admin 凭据提交独审判决。\n\n同一 MCP bridge 实现提供 agentd_lead 和 agentd_reviewer 两个固定连接，连接层从私有来源自动附带凭据，模型不需要填写 token，也没有业务工具切换角色。服务端根据凭据得到受信身份，拒绝请求自报 role。\n\n权限和租约在关键提交时重核，撤销或根重绑使旧代次失效。可信本机定位优先防误操作与身份混用，不承诺抵御恶意同 UID 管理员；线程和凭据分离也不能证明模型推理语义绝对独立。", "sources": [{"path": "docs/design/INTERFACE_GUIDE.md", "line": 17, "short": "两个固定 MCP 连接"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 77, "short": "权限矩阵"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 110, "short": "凭据生命周期"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"同一个用户，也需要清楚的角色边界\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"238\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">操作<\/text><text x=\"396.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">Dashboard 管理<\/text><text x=\"681.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">主线<\/text><text x=\"966.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">reviewer<\/text><text x=\"1251.00\" y=\"271.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">worker<\/text><rect x=\"80\" y=\"291\" width=\"1440\" height=\"82\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"330.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">配置池 / 管理接入<\/text><text x=\"396.00\" y=\"330.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">允许<\/text><text x=\"681.00\" y=\"330.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"966.00\" y=\"330.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"1251.00\" y=\"330.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><rect x=\"80\" y=\"373\" width=\"1440\" height=\"82\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"412.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">提交 / 继续 / 取消<\/text><text x=\"396.00\" y=\"412.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">授权项目内<\/text><text x=\"681.00\" y=\"412.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">允许<\/text><text x=\"966.00\" y=\"412.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"1251.00\" y=\"412.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><rect x=\"80\" y=\"455\" width=\"1440\" height=\"82\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"494.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">独立审核判决<\/text><text x=\"396.00\" y=\"494.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"681.00\" y=\"494.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"966.00\" y=\"494.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">有效领取内<\/text><text x=\"1251.00\" y=\"494.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><rect x=\"80\" y=\"537\" width=\"1440\" height=\"82\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"576.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">交付候选<\/text><text x=\"396.00\" y=\"576.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"681.00\" y=\"576.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"966.00\" y=\"576.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">—<\/text><text x=\"1251.00\" y=\"576.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">专属结果通道<\/text><rect x=\"80\" y=\"623\" width=\"1440\" height=\"184\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"110.00\" y=\"673.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">业务参数 → bridge 自动附凭据 → 后端认证 → 用例授权 → 状态检查<\/text><text x=\"110.00\" y=\"730.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">凭据轮换 / 撤销 / 根重绑都留痕；历史回执不能绕过当前权限。<\/text><text x=\"110.00\" y=\"774.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">定位：可信本机的职责隔离；恶意同 UID 强隔离不在本轮承诺内。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  接入与权限<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">同一个用户，也需要清楚的角色边界<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">固定角色连接自动加载凭据；每个后端用例继续核验权限和前置条件。<\/text><rect x=\"1292.0\" y=\"35\" width=\"228.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1304.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 固定角色 / D · 授权合同<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：两个固定 MCP 连接；权限矩阵；凭据生命周期<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">17 / 36<\/text><\/svg>"}, {"title": "原生工具循环保留，交付出口必须明确", "section": "执行与交付", "notes": "适配器只负责准备环境、启动原生 Claude Code、传递输入、观察运行、停止和收集交付。MCP、subagent、shell、网络与会话仍由原生 harness 负责，具体版本、relay 与私有配置能否兼容属于目标环境验证。\n\n每次执行得到 ExecutionInput/1，绑定精确任务、输入和配置。V0 建议唯一权威出口为执行专属 delivery.json，worker 先写临时文件再原子改名。执行闭合后，适配器核验 schema、路径、成员、大小、hash 和代码对象，再形成受信封装。退出 0、日志里的 success 或 worker 自报 hash 都不能替代这些检查。\n\n代码交付需要合法 commit 与固定 base 的关系；报告交付无需 commit，但必需报告和证据必须齐全。无效交付保存原件与进度，补交属于同任务的有界运行恢复，不消耗 REJECT。worker 自检与 reviewer 的独立验证分别记录。", "sources": [{"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 204, "short": "Worker 输入与交付"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 146, "short": "原生能力"}, {"path": "specs/agentd_v1/models.py", "line": 1002, "short": "WorkerDelivery 类型"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"原生工具循环保留，交付出口必须明确\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"250\" width=\"340\" height=\"189\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"296.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">ExecutionInput/1<\/text><text x=\"102.00\" y=\"340.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">任务、固定输入<\/text><text x=\"102.00\" y=\"373.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">配置与运行边界<\/text><line x1=\"425\" y1=\"342\" x2=\"440\" y2=\"342\" stroke=\"#3C7398\" stroke-width=\"2\"/><polygon points=\"440.00,342.00 429.19,347.22 429.19,336.78\" fill=\"#3C7398\"/><rect x=\"445\" y=\"250\" width=\"340\" height=\"189\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"467.00\" y=\"296.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">原生 Claude Code<\/text><text x=\"467.00\" y=\"340.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">read / edit / shell<\/text><text x=\"467.00\" y=\"373.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">MCP / subagent / session<\/text><line x1=\"790\" y1=\"342\" x2=\"805\" y2=\"342\" stroke=\"#127C72\" stroke-width=\"2\"/><polygon points=\"805.00,342.00 794.19,347.22 794.19,336.78\" fill=\"#127C72\"/><rect x=\"810\" y=\"250\" width=\"340\" height=\"189\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"832.00\" y=\"296.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">delivery.json<\/text><text x=\"832.00\" y=\"340.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">代码或报告<\/text><text x=\"832.00\" y=\"373.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">自检记录与成员清单<\/text><line x1=\"1155\" y1=\"342\" x2=\"1170\" y2=\"342\" stroke=\"#E76A3B\" stroke-width=\"2\"/><polygon points=\"1170
