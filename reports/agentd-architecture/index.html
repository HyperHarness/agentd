SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">从安装产物到最终成果，逐层记录 PASS / FAIL / NOT RUN。<\/text><rect x=\"1290.0\" y=\"35\" width=\"230.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1302.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 验收计划 / H · 真实验证<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：验收顺序；工作包；C01–C16 补充验收<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">28 / 36<\/text><\/svg>"}, {"title": "证明收益，需要同时看速度、等待、用量和对照", "section": "验证与交付", "notes": "吞吐比较同一预定任务集的串行与并行墙钟时间，以及固定观察时段内 PASS 数；如果并行增加资源要注明，任务集未全部结束不能宣称整体加速。交付时延从提交到最终审核，包含排队、审核和中断等待，成功和三轮失败分列，未结束展示年龄，取消单列。\n\nusage 记录原生可得的 input、output、cache、reasoning 字段及来源，避免累计值、增量或 subagent 汇总重复计算；缺失为 null 并给覆盖率。只掌握 worker 数据时只能叫 worker tokens。每个 PASS 的已知 token 消耗需包含该批失败、取消和中断任务的消耗；没有可靠价格和完整用量时不能称省钱。\n\n学习策略与随机基线比较同难度、同观察窗口的按期 PASS、时延和用量覆盖率，记录初始策略分组，保留未完成和取消。共享池会互相影响，无有效对照只能说分配改变，不能说优于随机。此页没有项目测量值。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 184, "short": "最小效果指标"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 198, "short": "队列与对照"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"证明收益，需要同时看速度、等待、用量和对照\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"239\" width=\"708\" height=\"255\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"291.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">吞吐<\/text><text x=\"105.00\" y=\"346.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">相同任务集的总墙钟时间<\/text><text x=\"105.00\" y=\"386.02\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">固定时间内 PASS 数<\/text><text x=\"105.00\" y=\"438.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">输入、验收、资源预算一致；串行基线可比较。<\/text><rect x=\"812\" y=\"239\" width=\"708\" height=\"255\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"837.00\" y=\"291.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">交付时延<\/text><text x=\"837.00\" y=\"346.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">提交 → 审核终态<\/text><text x=\"837.00\" y=\"386.02\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">含排队、审核、中断等待<\/text><text x=\"837.00\" y=\"438.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">成功 / 三轮失败分列；未结束年龄和取消单列。<\/text><rect x=\"80\" y=\"518\" width=\"708\" height=\"255\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"570.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">已知用量<\/text><text x=\"105.00\" y=\"625.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">整批尝试与返修的 tokens<\/text><text x=\"105.00\" y=\"665.02\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">同时报告角色范围与覆盖率<\/text><text x=\"105.00\" y=\"717.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">缺失为未知；失败消耗保留；token 不等于账单。<\/text><rect x=\"812\" y=\"518\" width=\"708\" height=\"255\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"837.00\" y=\"570.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"32\" font-weight=\"700\">学习增益<\/text><text x=\"837.00\" y=\"625.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">能力策略 vs 随机对照<\/text><text x=\"837.00\" y=\"665.02\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">同难度、同成熟窗口<\/text><text x=\"837.00\" y=\"717.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">记录初始策略组；样本不足时保留随机。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  验证与交付<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">证明收益，需要同时看速度、等待、用量和对照<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">机制可运行与产品有效果分别报告；缺失数据明确标为未知。<\/text><rect x=\"1304.0\" y=\"35\" width=\"216.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1316.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 指标口径 / 无实测收益<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：最小效果指标；队列与对照<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">29 / 36<\/text><\/svg>"}, {"title": "下一步：把关键未知逐个变成可验收的承诺", "section": "决策与行动", "notes": "首先由产品负责人选择首发环境和是否接受 V0 的明确限制：单项目独立任务、随机择模、主动领取、自动恢复可以为零、最小 U 安装。然后用准确 OS、内核、资源委派、原生 CLI、模型 relay 和客户端版本做关键探针。主机假设失败时重审方案，而不是继续把未经验证能力扩成更多平台。\n\n接着评审并冻结 V0 精确合同与限额，前后端可分别开发但尽早接通同一真实任务链。随后完成三轮、取消竞争、幂等、故障窗口、资源隔离和实际成果读取。V1 的通知、依赖、自动恢复、学习与生命周期按范围补齐。\n\n需要选择的参数包括难度量表、观察窗口、最小样本、差异/探索比例、租约与恢复预算、资源/磁盘限额、保留期限及升级支持窗口。候选初值不能在实现中被悄悄当作批准值。当前最值得投入的下一产物，是关键探针证据与一条真实闭环，而不是更多并列架构。", "sources": [{"path": "docs/design/DECISIONS_AND_EVIDENCE.md", "line": 71, "short": "待定决策"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 25, "short": "A–E 工作包"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 308, "short": "决定清单"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"下一步：把关键未知逐个变成可验收的承诺\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"236\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"269.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">决策包<\/text><text x=\"346.00\" y=\"269.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">需要明确什么<\/text><text x=\"1066.00\" y=\"269.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">形成的可评审结果<\/text><rect x=\"80\" y=\"289\" width=\"1440\" height=\"92\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"328.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">先定范围<\/text><text x=\"346.00\" y=\"328.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">首发主机组合；V0 阶段限制；原生工具与客户端矩阵<\/text><text x=\"1066.00\" y=\"328.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">产品范围决定 + SupportProfile<\/text><rect x=\"80\" y=\"381\" width=\"1440\" height=\"92\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"420.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">再证假设<\/text><text x=\"346.00\" y=\"420.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">资源委派、后代归属、U 独立、通知与长审核路径<\/text><text x=\"1066.00\" y=\"420.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">版本准确的探针证据<\/text><rect x=\"80\" y=\"473\" width=\"1440\" height=\"92\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"512.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">冻结合同<\/text><text x=\"346.00\" y=\"512.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">API、权限、幂等、资源、大小、租期、恢复与保留参数<\/text><text x=\"1066.00\" y=\"512.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">唯一契约与可运行正反例<\/text><rect x=\"80\" y=\"565\" width=\"1440\" height=\"92\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"604.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">交付闭环<\/text><text x=\"346.00\" y=\"604.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">配置 → 提交 → 执行 → 独审 → 成果；再验证并行故障<\/text><text x=\"1066.00\" y=\"604.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">真实端到端验收记录<\/text><rect x=\"80\" y=\"659\" width=\"1440\" height=\"147\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"112.00\" y=\"703.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">值得兑现的结果<\/text><text x=\"112.00\" y=\"762.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"35\" font-weight=\"700\">主线只管提出任务与使用成果，系统把过程推进到一个可信的结论。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  决策与行动<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">下一步：把关键未知逐个变成可验收的承诺<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">以下是推进顺序建议；没有替项目擅自批准分期、平台或参数。<\/text><rect x=\"1288.0\" y=\"35\" width=\"232.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1300.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 推进建议 / P·H · 待闭合<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：待定决策；A–E 工作包；决定清单<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">30 / 36<\/text><\/svg>"}, {"title": "附录：当前到底有什么，哪些仍然未知", "section": "证据与追踪", "notes": "本次在 /home/cying/agentd-new 使用文档指定的已有解释器运行 python -m specs.agentd_v1.check，结果 PASS。报告值为 29 operations/routes、153 registered_models、154 schema_definitions、8 valid_examples、7 structural_rejections、7 semantic_rejections、5 json_policy_rejections、3 split_contract_regression_checks，三份生成物一致。runtime_model_host_validation 明确为 NOT_RUN。\n\n同时执行 sha256sum -c audit/SHA256SUMS，原始快照清单的 32 个受覆盖文件均 OK。本次只新增 reports/agentd-architecture 下的报告与生成源码，原审计描述的是既有快照，不把新增报告伪称为原来已审计内容。运行 Python 检查可能生成可删除的 __pycache__，不属于设计变更。\n\nR 是用户已确认要求；D 是候选设计；H 是需要实际主机、模型或客户端验证的假设；P 是尚未选定参数；F 是有版本和范围的事实。离线 PASS 不能将 D/H/P 升级为已支持能力。报告内标为示例的任务、界面与统计数字不属于项目实测。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 5, "short": "决定状态"}, {"path": "specs/agentd_v1/README.md", "line": 22, "short": "校验方法与边界"}, {"path": "audit/VALIDATION.md", "line": 1, "short": "快照审计"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"附录：当前到底有什么，哪些仍然未知\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"237\" width=\"272\" height=\"131\" rx=\"16\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"100.00\" y=\"302.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"53\" font-weight=\"700\">R<\/text>< font-weight=\"700\">有范围的事实<\/text><rect x=\"80\" y=\"409\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"442.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">检查范围<\/text><text x=\"526.00\" y=\"442.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">本次结果<\/text><text x=\"881.00\" y=\"442.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">结论边界<\/text><rect x=\"80\" y=\"462\" width=\"1440\" height=\"77\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"500.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">契约结构与一致性<\/text><text x=\"526.00\" y=\"500.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">PASS<\/text><text x=\"881.00\" y=\"500.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">29 操作；153 注册模型；3 份生成物一致<\/text><rect x=\"80\" y=\"539\" width=\"1440\" height=\"77\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"577.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">样例与反例<\/text><text x=\"526.00\" y=\"577.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">PASS<\/text><text x=\"881.00\" y=\"577.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">8 正例；19 反例；3 组拆分回归<\/text><rect x=\"80\" y=\"616\" width=\"1440\" height=\"77\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"654.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">原始快照文件摘要<\/text><text x=\"526.00\" y=\"654.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">32 / 32 OK<\/text><text x=\"881.00\" y=\"654.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">核对既有 SHA256SUMS 覆盖文件<\/text><rect x=\"80\" y=\"693\" width=\"1440\" height=\"77\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"731.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">真实服务 / 模型 / 主机<\/text><text x=\"526.00\" y=\"731.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">NOT RUN<\/text><text x=\"881.00\" y=\"731.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">没有新服务实现与真实效果验收证据<\/text><text x=\"80.00\" y=\"807.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">离线可执行设计契约 ≠ 已运行的新产品。每页保留文件依据，详细行号见讲解备注。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  证据与追踪<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">附录：当前到底有什么，哪些仍然未知<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">报告制作时重新运行了现有离线检查，未运行真实服务、模型或主机验收。<\/text><rect x=\"1270.0\" y=\"35\" width=\"250.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1282.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">F · 本次复核 / R·D·H·P · 状态<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：决定状态；校验方法与边界；快照审计<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">31 / 36<\/text><\/svg>"}, {"title": "附录：需求追踪 F01–F09", "section": "证据与追踪", "notes": "F01 验证主线退出后任务仍存在，以及创建丢响应后原 key 返回同一任务。F02 验证固定池自动择模、容量排队、同任务和同槽唯一未闭合执行。F03 在真实执行环境验证 read/edit/shell/MCP/subagent，而不只是单独 CLI 探针。\n\nF04 验证任务写入不改变模板和其他 worker 状态；F05 真正注入资源故障，核后代归属与其他任务继续；F06 工作区回收后仍能取得保留候选和报告；F07 reviewer 独立副本、自有证据与租约绑定；F08 三个有效拒绝原子结束，重启和重发不重计；F09 持久事项和通知传输分离。\n\n这些是完整需求的追踪，交付按已接受的版本范围进行。V0 主动领取，V1 才承诺经验证的客户端提示路径；V0 独立任务，依赖 DAG 在 V1。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 85, "short": "核心需求"}, {"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 147, "short": "对象与交付"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 79, "short": "补充验收"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"附录：需求追踪 F01–F09\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"237\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"270.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" fo FFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"554.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">F05<\/text><text x=\"196.00\" y=\"554.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">资源保护<\/text><text x=\"536.00\" y=\"554.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">逐执行 CPU / memory / pids 总预算<\/text><text x=\"1116.00\" y=\"554.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">一个超限，其他任务仍可完成<\/text><rect x=\"80\" y=\"575\" width=\"1440\" height=\"57\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"611.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">F06<\/text><text x=\"196.00\" y=\"611.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">成果保存<\/text><text x=\"536.00\" y=\"611.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">不可变候选、保留引用与完整清单<\/text><text x=\"1116.00\" y=\"611.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">工作区清理后成果仍可读取<\/text><rect x=\"80\" y=\"632\" width=\"1440\" height=\"57\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"668.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">F07<\/text><text x=\"196.00\" y=\"668.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">独立审核<\/text><text x=\"536.00\" y=\"668.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">独立副本、有效租约、候选证据绑定<\/text><text x=\"1116.00\" y=\"668.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">自审、过期与错候选均拒绝<\/text><rect x=\"80\" y=\"689\" width=\"1440\" height=\"57\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"725.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">F08<\/text><text x=\"196.00\" y=\"725.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">三轮闭环<\/text><text x=\"536.00\" y=\"725.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">判决 / 次数 / 终态 / outbox 同事务<\/text><text x=\"1116.00\" y=\"725.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">三拒绝结束，不开始第四轮<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"57\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"782.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">F09<\/text><text x=\"196.00\" y=\"782.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">通知与唤醒<\/text><text x=\"536.00\" y=\"782.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">持久业务队列 + 适配器提示<\/text><text x=\"1116.00\" y=\"782.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">失败可查询；重发不重计分<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  证据与追踪<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">附录：需求追踪 F01–F09<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">编号沿用需求基线；机制是候选实现路径，验收要落到真实行为。<\/text><rect x=\"1300.0\" y=\"35\" width=\"220.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1312.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">需求 → 设计 → 可观察验收<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：核心需求；对象与交付；补充验收<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">32 / 36<\/text><\/svg>"}, {"title": "附录：需求追踪 F10–F17", "section": "证据与追踪", "notes": "F10 固定 worker 池要把配置请求值、生效观察和未知分开，更新产生新版本而不热改绑定任务；F11 明确故障类别、自动预算、停止核对、副作用处置和显式继续；F12 三个页面和薄客户端使用同一后台事实。\n\nF13 让原生工具可用，工具代码作为普通成果审阅后由主线选择共享版本，基础阶段无需自动推广平台。F14 固定上游 Task ID 和精确产物，失败使下游等待，PASS 不代表已合并。F15 同时说明控制面、worker 后代、外部 Codex 和 U 的资源所有权。\n\nF16 安装、升级和卸载统一交 U，记录原 operation_id，在停 daemon 或终端后仍可接续；F17 支持窗口先明确，失败保全当前数据，回退要看实际数据兼容和切换后写入。V0 最小 U 安装和本地备份恢复，V1 完整生命周期流程。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 85, "short": "核心需求"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 172 =\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">与有效 REJECT 分开；恢复前仍核停止与副作用<\/text><rect x=\"80\" y=\"420\" width=\"1440\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"457.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">候选内容上限<\/text><text x=\"466.00\" y=\"457.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">成员总量 1 GiB；bundle 2 GiB<\/text><text x=\"846.00\" y=\"457.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">超限明确处理，不静默截断必要材料<\/text><rect x=\"80\" y=\"486\" width=\"1440\" height=\"66\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"523.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">审核证据大小<\/text><text x=\"466.00\" y=\"523.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">每段 256 KiB；总量 16 MiB<\/text><text x=\"846.00\" y=\"523.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">分段清单验证顺序、总长度与总摘要<\/text><rect x=\"80\" y=\"552\" width=\"1440\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"589.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">最终成果保留<\/text><text x=\"466.00\" y=\"589.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">90 天<\/text><text x=\"846.00\" y=\"589.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">未定策略时 retain；有效 pin 保护义务优先<\/text><rect x=\"80\" y=\"618\" width=\"1440\" height=\"66\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"655.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">参考主机<\/text><text x=\"466.00\" y=\"655.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">8 逻辑 CPU / 32 GiB 内存<\/text><text x=\"846.00\" y=\"655.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">校准 profile，不能写成已批准最低配置<\/text><rect x=\"80\" y=\"684\" width=\"1440\" height=\"66\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"721.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">查询响应指标<\/text><text x=\"466.00\" y=\"721.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">p95 ≤ 1 秒；p99 ≤ 3 秒<\/text><text x=\"846.00\" y=\"721.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">明确负载与错误率条件；当前没有实测结果<\/text><text x=\"80.00\" y=\"800.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">另须选择：难度量表、观察窗口 H、最小样本、差异门槛、探索比例与升级支持窗口。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  参数与支持范围<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">附录：这些数值仍是候选，不能静默变成承诺<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">首发 Linux / WSL2 组合待选择；每个主机组合单独验证。<\/text><rect x=\"1292.0\" y=\"35\" width=\"228.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1304.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">P · 建议初值 / H · 目标环境<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：DRAFT_PARAMETERS；保留策略候选；参考 profile 与负载<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">34 / 36<\/text><\/svg>"}, {"title": "附录：历史问题给出风险线索，验证仍要重新做", "section": "历史证据", "notes": "历史资料的价值是解释为什么这些边界值得投入，不能拿旧修复或旧测试结果充当新方案验收。旧 reviewer 视图曾把目标裁至 4096 字节，启示是完整性包含验收目标，不只是附件。候选准备期间出现过 task/list 30 秒超时和静态页超过 3 秒无响应；缺现场栈，不能把某一函数认定为全部根因，但必须验控制面在重负载下可用。\n\nClaude Code 2.1.289 的合成探针显示部分原生工具能运行，不代表项目 skills、hooks、agents、MCP 与授权链齐全。另有实际安装入口和生成配置失败，说明必须从独立发布目录跑同一真实任务，避免开发路径掩盖缺依赖。\n\n旧文档与程序对数据库迁移能力的描述不一致，说明需要唯一权威来源和支持窗口。历史机械 Git 操作、证据字节、配置生效、磁盘容量等更多教训在来源专题中；本报告用第 21、23、25、28 页的机制与验收承接。", "sources": [{"path": "docs/design/DECISIONS_AND_EVIDENCE.md", "line": 22, "short": "旧问题与版本范围"}, {"path": "docs/design/DECISIONS_AND_EVIDENCE.md", "line": 39, "short": "P0 / P1 复查教训"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"附录：历史问题给出风险线索，验证仍要重新做\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"235\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"268.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">旧记录说明的风险<\/text><text x=\"526.00\" y=\"268.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">对新设计的启示<\/text><text x=\"1026.00\" y=\"268.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">对应验收<\/text><rect x=\"80\" y=\"288\" width=\"1440\" height=\"100\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"326.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">审核目标曾被裁至<\/text><text x=\"96.00\" y=\"357.75\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">4096 字节<\/text><text x=\"526.00\" y=\"326.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">目标、验收、候选、证据<\/text><text x=\"526.00\" y=\"357.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">都需要完整可读<\/text><text x=\"1026.00\" y=\"326.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">长中文目标的最后一句<\/text><text x=\"1026.00\" y=\"357.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">仍决定实际验收<\/text><rect x=\"80\" y=\"388\" width=\"1440\" height=\"100\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"426.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">候选准备时查询超时<\/text><text x=\"96.00\" y=\"457.75\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">控制进程仍然存活<\/text><text x=\"526.00\" y=\"426.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">复制、hash、Git、解析<\/text><text x=\"526.00\" y=\"457.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">有界并避开 HTTP 阻塞<\/text><text x=\"1026.00\" y=\"426.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">放慢候选准备，仍可<\/text><text x=\"1026.00\" y=\"457.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">查询与受理取消<\/text><rect x=\"80\" y=\"488\" width=\"1440\" height=\"100\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"526.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">合成原生探针可运行<\/text><text x=\"96.00\" y=\"557.75\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">项目配置却有缺项<\/text><text x=\"526.00\" y=\"526.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">工具可见、配置加载、<\/text><text x=\"526.00\" y=\"557.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">授权可用与产物取得分开核<\/text><text x=\"1026.00\" y=\"526.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">在实际 worker 环境<\/text><text x=\"1026.00\" y=\"557.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">使用所需 MCP / subagent<\/text><rect x=\"80\" y=\"588\" width=\"1440\" height=\"100\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"626.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">真实入口 / 生成配置失败<\/text><text x=\"96.00\" y=\"657.75\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">组件检查曾绕过该路径<\/text><text x=\"526.00\" y=\"626.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">独立发布目录、生成配置<\/text><text x=\"526.00\" y=\"657.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">和真实 CLI 组成同一链<\/text><text x=\"1026.00\" y=\"626.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">让原开发路径不可访问<\/text><text x=\"1026.00\" y=\"657.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">仍能跑通任务<\/text><rect x=\"80\" y=\"688\" width=\"1440\" height=\"100\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"726.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">指南与程序对旧库转换<\/text><text x=\"96.00\" y=\"757.75\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">给出了不同承诺<\/text><text x=\"526.00\" y=\"726.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">唯一权威来源；明确<\/text><text x=\"526.00\" y=\"757.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">支持版本与拒绝行为<\/text><text x=\"1026.00\" y=\"726.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">不支持版本在写库前<\/text><text x=\"1026.00\" y=\"757.75\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">拒绝并保留数据<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  历史证据<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">附录：历史问题给出风险线索，验证仍要重新做<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">以下为项目专题对旧版本记录的归纳；本报告没有重跑历史实验。<\/text><rect x=\"1294.0\" y=\"35\" width=\"226.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1306.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">F · 旧范围事实 / D · 新门槛<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：旧问题与版本范围；P0 / P1 复查教训<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">35 / 36<\/text><\/svg>"}, {"title": "按问题返回文件，继续评审与实施", "section": "来源导航", "notes": "本报告根据当前工作区现有资料形成，没有修改产品基线、行为专题或契约源码。阅读路径可以按问题跳转：先产品基线，再架构总览，再相关专题；字段、错误、权限映射和示例查可执行契约及生成 API 参考。\n\n资料权威分工：需求基线拥有目标、角色、终点和范围；架构总览拥有系统边界和模块职责；六个专题拥有行为与恢复约束；models.py / operations.py 拥有结构与传输映射，生成物不手工修改。\n\n报告交付包含可编辑 PPTX、嵌入字体的矢量 PDF、带目录和讲解备注的离线 HTML、逐页讲解与依据 HTML，以及可复现的生成源码。浏览器方向键翻页，N 展开备注，G 打开目录，F 全屏。需要转发时优先 PDF；需要修改内容使用 PPTX 或生成源码；离线 HTML 自身可放映，来源链接则需要保留与项目 docs/specs 的相对目录。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 1, "short": "需求基线"}, {"path": "docs/SOFTWARE_ARCHITECTURE_PROPOSAL.md", "line": 1, "short": "架构总览"}, {"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 1, "short": "任务与独审"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 1, "short": "运行与生命周期"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 1, "short": "事务与存储"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 1, "short": "接入与接口"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 1, "short": "验收计划"}, {"path": "docs/design/DECISIONS_AND_EVIDENCE.md", "line": 1, "short": "决策与证据"}, {"path": "specs/agentd_v1/README.md", "line": 1, "short": "可执行契约"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"按问题返回文件，继续评审与实施\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"234\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"267.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">阅读入口<\/text><text x=\"476.00\" y=\"267.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">回答的问题<\/text><text x=\"1106.00\" y=\"267.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">本报告对应页<\/text><rect x=\"80\" y=\"287\" width=\"1440\" height=\"62\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" str \"1.5\"/><text x=\"96.00\" y=\"695.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">验收计划 + 决策与证据<\/text><text x=\"476.00\" y=\"695.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">如何分批交付、历史依据、待闭合事项<\/text><text x=\"1106.00\" y=\"695.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">27–30 / 34–35<\/text><rect x=\"80\" y=\"721\" width=\"1440\" height=\"62\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"757.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">specs/agentd_v1 + audit<\/text><text x=\"476.00\" y=\"757.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">字段、路由、生成物、样例、离线证据<\/text><text x=\"1106.00\" y=\"757.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">15 / 31–34<\/text><text x=\"80.00\" y=\"819.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">报告示意不替代协议；实现变化应同步需求影响、所属专题、契约生成物与验收证据。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  来源导航<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">按问题返回文件，继续评审与实施<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">每页的备注和离线讲解稿都保留具体来源；字段和路由以契约源码为准。<\/text><rect x=\"1252.0\" y=\"35\" width=\"268.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1264.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">报告依据 · 项目快照 2026-10-28<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：需求基线；架构总览；任务与独审 等 9 份，详见备注<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">36 / 36<\/text><\/svg>"}];const $=id=>document.getElementById(id);let n=Math.min(slides.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));let showNotes=false;
    function render(){const s=slides[n];$('slide').innerHTML=s.svg;$('title').textContent=s.title;$('noteTitle').textContent=String(n+1).padStart(2,'0')+' · '+s.title;$('notes').textContent=s.notes;$('sources').replaceChildren(...s.sources.map(x=>{let li=document.createElement('li'),a=document.createElement('a');a.href='../../'+x.path;a.target='_blank';a.textContent=x.short+' · '+x.path+' 第 '+x.line+' 行';li.append(a);return li}));$('counter').textContent=String(n+1).padStart(2,'0')+' / '+slides.length;$('bar').style.width=(n+1)/slides.length*100+'%';$('prev').disabled=n===0;$('next').disabled=n===slides.length-1;history.replaceState(null,'','#'+(n+1));document.title=(n+1)+' · '+s.title+' | agentd';}
    function go(v){n=Math.max(0,Math.min(slides.length-1,v));render()}
    function toggleNotes(){showNotes=!showNotes;$('aside').classList.toggle('hidden',!showNotes);$('notesBtn').setAttribute('aria-pressed',showNotes)}
    function grid(){const q=$('search').value.toLowerCase();$('grid').replaceChildren(...slides.map((s,i)=>{if(!(s.title+s.section).toLowerCase().includes(q))return null;let b=document.createElement('button');b.className='thumb'+(i===n?' active':'');b.innerHTML=s.svg;let p=document.createElement('p');p.textContent=String(i+1).padStart(2,'0')+' · '+s.title;b.append(p);b.onclick=()=>{go(i);$('dialog').close()};return b}).filter(Boolean))}
    function openGrid(){grid();$('dialog').showModal();$('search').focus()}
    function full(){if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.().catch(()=>{})}
    $('prev').onclick=()=>go(n-1);$('next').onclick=()=>go(n+1);$('notesBtn').onclick=toggleNotes;$('outline').onclick=openGrid;$('search').oninput=grid;$('close').onclick=()=>$('dialog').close();$('full').onclick=full;
    document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||$('dialog').open)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(n+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(n-1)}else if(e.key==='Home'){e.preventDefault();go(0)}else if(e.key==='End'){e.preventDefault();go(slides.length-1)}else if(e.key.toLowerCase()==='n')toggleNotes();else if(e.key.toLowerCase()==='g')openGrid();else if(e.key.toLowerCase()==='f')full()});
    let touchX=0;$('slide').addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});$('slide').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>60)go(n+(d<0?1:-1))},{passive:true});
    window.addEventListener('beforeprint',()=>{$('print').innerHTML=slides.map(s=>'<section>'+s.svg+'</section>').join('')});render();
