.00,342.00 1159.19,347.22 1159.19,336.78\" fill=\"#E76A3B\"/><rect x=\"1175\" y=\"250\" width=\"340\" height=\"189\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1197.00\" y=\"296.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">受信交接与候选<\/text><text x=\"1197.00\" y=\"340.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">停止证明、实际摘要<\/text><text x=\"1197.00\" y=\"373.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">完整性与归属核验<\/text><rect x=\"80\" y=\"493\" width=\"700\" height=\"227\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"516\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"548.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">代码成果<\/text><text x=\"105.00\" y=\"607.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">固定 base → 可获取的 candidate commit；未提交修<\/text><text x=\"105.00\" y=\"646.42\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">改留在恢复工作区，不隐式混入候选。<\/text><rect x=\"804\" y=\"493\" width=\"716\" height=\"227\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"804\" y=\"516\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"829.00\" y=\"548.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">报告成果<\/text><text x=\"829.00\" y=\"607.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">主报告 + 不可变文件与证据；无需制造 commit，也要<\/text><text x=\"829.00\" y=\"646.42\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">满足全部必需交付键。<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">交付格式错误、文件缺失或读取失败：保存进度并诊断，审核次数保持不变。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  执行与交付<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">原生工具循环保留，交付出口必须明确<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">服务用可核对的材料形成候选；开发工具仍由原生 Claude Code 提供。<\/text><rect x=\"1292.0\" y=\"35\" width=\"228.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1304.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 原生能力 / D · 交付协议<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：Worker 输入与交付；原生能力；WorkerDelivery 类型<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">18 / 36<\/text><\/svg>"}, {"title": "独审的关键：材料独立、候选精确、判决有效", "section": "执行与交付", "notes": "服务向 reviewer 提供冻结任务合同、候选和完整证据索引。代码材料使用限定授权范围、可核验自足性的 Git bundle；报告使用不可变成员清单。reviewer 在自己的 checkout 或文件副本运行检查，避免测试修改候选原件或 worker 接续目录。必需的 LFS、submodule 或外部材料也必须明确可取。\n\n判决须覆盖冻结验收项，并区分 worker 自检记录与 reviewer 自己产生的证据。PASS 不能包含未满足或无法验证项；REJECT 至少有真实不满足项；环境条件不足使用 defer。服务保证候选绑定与材料检查，外部测试过程仍是 reviewer 声明，不冒充 daemon 监督执行。\n\n领取有 TTL 和绝对总期。自然材料读取或证据上传可让连接层另发 POST renew，普通 GET、ping 或 bridge 存活本身不续租。过期后用新领取重领同候选、重新核验摘要与权限，再复用仍然适用的证据；不能把旧报告直接换 handle 提交。", "sources": [{"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 240, "short": "独立材料与租约"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 39, "short": "reviewer 行为"}, {"path": "docs/design/INTERFACE_GUIDE.md", "line": 217, "short": "判决覆盖与绑定"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"独审的关键：材料独立、候选精确、判决有效\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"239\" width=\"464\" height=\"252\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"262\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#3C7398\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"292.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">1 领精确候选<\/text><text x=\"105.00\" y=\"351.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">candidate_id + 内容摘要<\/text><text x=\"105.00\" y=\"387.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">固定验收 + 有效 review_handle<\/text><rect x=\"568\" y=\"239\" width=\"464\" height=\"252\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"568\" y=\"262\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"593.00\" y=\"292.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">2 建独立副本<\/text><text x=\"593.00\" y=\"351.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">自足 bundle / 成员清单<\/text><text x=\"593.00\" y=\"387.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">自有 checkout，不改候选原件<\/text><rect x=\"1056\" y=\"239\" width=\"464\" height=\"252\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"1056\" y=\"262\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1081.00\" y=\"292.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">3 存独立证据<\/text><text x=\"1081.00\" y=\"351.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">命令、实际 HEAD、时间<\/text><text x=\"1081.00\" y=\"387.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">退出观察、环境与日志引用<\/text><rect x=\"80\" y=\"527\" width=\"1440\" height=\"178\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"110.00\" y=\"582.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">PASS<\/text><text x=\"110.00\" y=\"632.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">验收满足，任务成功。<\/text><text x=\"590.00\" y=\"582.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">REJECT<\/text><text x=\"590.00\" y=\"632.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">确有不满足项，计一次拒绝。<\/text><text x=\"1085.00\" y=\"582.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"34\" font-weight=\"700\">defer<\/text><text x=\"1085.00\" y=\"632.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">无法判断，保留原候选。<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">租约过期：重领同候选并复核；网络存活和模型仍在审核是两回事。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  执行与交付<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">独审的关键：材料独立、候选精确、判决有效<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">reviewer 验证自己的副本，保存自己的证据，并对当前有效领取提交判决。<\/text><rect x=\"1288.0\" y=\"35\" width=\"232.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1300.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 独审 / D·H · 材料与租约<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：独立材料与租约；reviewer 行为；判决覆盖与绑定<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">19 / 36<\/text><\/svg>"}, {"title": "发生 OOM 后，系统应保住这一任务", "section": "故障与恢复", "notes": "设想任务已经被有效拒绝一次，返修时内存超限。先用真实资源观察确认故障，不仅凭 SIGKILL 推断 OOM。系统保存工作区、未提交修改、原生会话引用、日志和已用审核次数。运行故障不增加 REJECT，自动额度耗尽也不自动判定任务失败。\n\n恢复前核对旧执行与本地后代已闭合，并处理不明外部副作用。管理员可以为该任务建立完整资源覆盖，例如把后续 Execution 的预算从 4 GiB 提升至 8 GiB；这是文档中的示例，不是默认配置。旧模型和执行配置保持绑定。当前运行的资源组不会被热改。\n\n主线读取后端当前 action_ref，再显式请求继续。原会话可用就接续，否则新会话接手已有进度；如果输入和工作区无法恢复，可以明确选择同合同重做或取消。副作用不明时仅点击继续不能越过核对，不提供 force 或 reset_rejections。取消是终态，不能作为调资源后恢复的手段。", "sources": [{"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 156, "short": "恢复故障窗口"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 171, "short": "恢复动作"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 172, "short": "任务资源覆盖"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"发生 OOM 后，系统应保住这一任务\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"259\" width=\"340\" height=\"203\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"307.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">① 保存进度<\/text><text x=\"102.00\" y=\"349.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">代码、会话、日志<\/text><text x=\"102.00\" y=\"382.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">已用拒绝次数 = 1<\/text><line x1=\"426\" y1=\"359\" x2=\"440\" y2=\"359\" stroke=\"#3C7398\" stroke-width=\"2\"/><polygon points=\"440.00,359.00 429.19,364.22 429.19,353.78\" fill=\"#3C7398\"/><rect x=\"445\" y=\"259\" width=\"340\" height=\"203\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"467.00\" y=\"307.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">② 核对停止<\/text><text x=\"467.00\" y=\"349.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">旧执行与所有后代<\/text><text x=\"467.00\" y=\"382.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">外部副作用是否明确<\/text><line x1=\"791\" y1=\"359\" x2=\"805\" y2=\"359\" stroke=\"#E76A3B\" stroke-width=\"2\"/><polygon points=\"805.00,359.00 794.19,364.22 794.19,353.78\" fill=\"#E76A3B\"/><rect x=\"810\" y=\"259\" width=\"340\" height=\"203\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"832.00\" y=\"307.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">③ 修复条件<\/text><text x=\"832.00\" y=\"349.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">例：任务资源覆盖<\/text><text x=\"832.00\" y=\"382.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">4 GiB → 8 GiB<\/text><line x1=\"1156\" y1=\"359\" x2=\"1170\" y2=\"359\" stroke=\"#127C72\" stroke-width=\"2\"/><polygon points=\"1170.00,359.00 1159.19,364.22 1159.19,353.78\" fill=\"#127C72\"/><rect x=\"1175\" y=\"259\" width=\"340\" height=\"203\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1197.00\" y=\"307.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">④ 显式继续<\/text><text x=\"1197.00\" y=\"349.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">原会话 / 新会话接手<\/text><text x=\"1197.00\" y=\"382.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">原合同、模型、次数<\/text><rect x=\"80\" y=\"512\" width=\"700\" height=\"211\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"535\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"567.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">可以确认停止，且副作用明确<\/text><text x=\"105.00\" y=\"627.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">通过准入后建立唯一新执行，接续已保存成果。<\/text><rect x=\"804\" y=\"512\" width=\"716\" height=\"211\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"804\" y=\"535\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"829.00\" y=\"567.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">仍有未知执行或不明副作用<\/text><text x=\"829.00\" y=\"627.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">保留占位、显示原因，先核对或明确处置，再决定是<\/text><text x=\"829.00\" y=\"667.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">否恢复。<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"787.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">恢复额度、审核恢复额度、有效 REJECT 次数，分别记账并保留历史。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  故障与恢复<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">发生 OOM 后，系统应保住这一任务<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">情境示意：第一次有效拒绝后，返修执行因内存不足而中断。<\/text><rect x=\"1308.0\" y=\"35\" width=\"212.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1320.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 可继续 / D · 恢复机制<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：恢复故障窗口；恢复动作；任务资源覆盖<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">20 / 36<\/text><\/svg>"}, {"title": "可靠性集中在五个“刚好出故障”的窗口", "section": "故障与恢复", "notes": "SQLite 的事务不包含文件系统、进程或远端副作用，所以关键不是写一个万能 success，而是保存操作意图、精确身份和已确认步骤，并在重启后对账。\n\n启动窗口使用 launch_id、generation、门控监督器和运行许可，在绑定可核验身份前不让子进程执行业务。候选发布先完成不可变内容与摘要，再提交 DB 引用；文件已发布但事务失败时按原 publish operation 对账。判决、计数、任务结果和 outbox 在一笔事务内提交；响应丢失用原 key 读取结果。\n\n取消只有在所属执行闭合后才释放容量；恢复也只有在旧执行和副作用核清后才能建新执行。同 key 同内容返回原结果，不同内容冲突；当前授权检查优先于历史回执。五类路径是固定业务协议，不引入可编程通用工作流引擎。各机制仍要通过实际主机故障注入。", "sources": [{"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 100, "short": "五条关键路径"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 77, "short": "幂等与操作结果"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"可靠性集中在五个“刚好出故障”的窗口\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"232\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"265.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">路径<\/text><text x=\"286.00\" y=\"265.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">最危险的时刻<\/text><text x=\"786.00\" y=\"265.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">候选设计怎样收住结果<\/text><rect x=\"80\" y=\"285\" width=\"1440\" height=\"91\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"323.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">启动<\/text><text x=\"286.00\" y=\"323.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">进程已创建，DB 尚未记清身份<\/text><text x=\"786.00\" y=\"323.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">门控 + launch 身份；未知时保留占位，核对原执行。<\/text><rect x=\"80\" y=\"376\" width=\"1440\" height=\"91\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"414.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">发布<\/text><text x=\"286.00\" y=\"414.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">文件已写好，Candidate 事务失败<\/text><text x=\"786.00\" y=\"414.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">先发布内容，后提交引用；按原 publish 操作对账。<\/text><rect x=\"80\" y=\"467\" width=\"1440\" height=\"91\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"505.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">判决<\/text><text x=\"286.00\" y=\"505.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">判决已提交，但响应丢失<\/text><text x=\"786.00\" y=\"505.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">判决 / 计数 / 终态 / outbox 原子提交；原 key 查回。<\/text><rect x=\"80\" y=\"558\" width=\"1440\" height=\"91\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"596.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">取消<\/text><text x=\"286.00\" y=\"596.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">父 PID 消失，后代仍在运行<\/text><text x=\"786.00\" y=\"596.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">核对整个执行边界闭合后，才 canceled 并释放槽。<\/text><rect x=\"80\" y=\"649\" width=\"1440\" height=\"91\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"687.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">恢复<\/text><text x=\"286.00\" y=\"687.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">远端动作可能已发生，本地无回执<\/text><text x=\"786.00\" y=\"687.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">先查副作用；只对已证明安全的同一操作接续。<\/text><rect x=\"80\" y=\"764\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"804.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">“未知”是需要保留的事实；把超时当作未执行，会制造重复副作用。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  故障与恢复<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">可靠性集中在五个“刚好出故障”的窗口<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">先保存意图，再做外部动作；响应丢失时，按原操作核对事实。<\/text><rect x=\"1274.0\" y=\"35\" width=\"246.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1286.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 一致性协议 / H · 故障注入<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：五条关键路径；幂等与操作结果<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">21 / 36<\/text><\/svg>"}, {"title": "运行拓扑：把控制余量与执行预算分开", "section": "运行架构", "notes": "候选拓扑是一个 S 服务，内部有 C 控制组和逐执行 worker 资源组，服务外有按需 U。C 中放监督器和业务 daemon；worker 的 shell、本地 MCP 和 subagent 后代共享该次执行的 CPU、内存和 pids 总预算。一个 worker 的普通故障应被遏制在该执行边界。\n\nS 的准入总账必须为 C 和辅助开销保留余量，只给 C 一个最大值并不能证明有保底资源。U 也有自己的资源预算，S 和 U 同时运行时仍需要主机余量。外部主线、reviewer、已存在的共享服务和远端 MCP 不纳入 worker 预算。\n\n新方案默认不新增旧设计中的专用父池 P，因此没有等同于 P 的跨服务原子总预算保证；如确有需求应重新评审。Linux/WSL2 只是候选平台，必须实测委派、后代归属、worker 超限而控制面可用、杀 daemon 与停 S 的差别，以及 U 在 S 停止后继续。", "sources": [{"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 83, "short": "P / S / C 的关系"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 91, "short": "进程资源所有权"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 41, "short": "目标主机探针"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"运行拓扑：把控制余量与执行预算分开\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"240\" width=\"1040\" height=\"485\" rx=\"20\" fill=\"#1D4244\" stroke=\"#629988\" stroke-width=\"1.5\"/><text x=\"108.00\" y=\"292.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">S · agentd 常驻服务 / 总预算与停止边界<\/text><rect x=\"109\" y=\"326\" width=\"981\" height=\"105\" rx=\"14\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"134.00\" y=\"374.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">C · 控制资源组<\/text><text x=\"134.00\" y=\"415.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">业务 daemon + 固定宿主监督器 + 控制余量<\/text><rect x=\"109\" y=\"470\" width=\"313\" height=\"215\" rx=\"14\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"131.00\" y=\"518.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">Worker 1<\/text><text x=\"131.00\" y=\"566.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">CPU / memory / pids<\/text><text x=\"131.00\" y=\"597.74\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">私有工作区与会话<\/text><text x=\"131.00\" y=\"629.48\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">本地 MCP / 子进程<\/text><rect x=\"443\" y=\"470\" width=\"313\" height=\"215\" rx=\"14\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"465.00\" y=\"518.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">Worker 2<\/text><text x=\"465.00\" y=\"566.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">CPU / memory / pids<\/text><text x=\"465.00\" y=\"597.74\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">私有工作区与会话<\/text><text x=\"465.00\" y=\"629.48\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">本地 MCP / 子进程<\/text><rect x=\"777\" y=\"470\" width=\"313\" height=\"215\" rx=\"14\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"799.00\" y=\"518.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">Worker 3<\/text><text x=\"799.00\" y=\"566.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">CPU / memory / pids<\/text><text x=\"799.00\" y=\"597.74\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">私有工作区与会话<\/text><text x=\"799.00\" y=\"629.48\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">本地 MCP / 子进程<\/text><rect x=\"1160\" y=\"240\" width=\"360\" height=\"229\" rx=\"18\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1185.00\" y=\"289.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">U · 生命周期执行器<\/text><text x=\"1185.00\" y=\"344.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">独立于 S<\/text><text x=\"1185.00\" y=\"379.88\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">固定运行环境<\/text><text x=\"1185.00\" y=\"415.76\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"400\">安装 / 升级 / 卸载<\/text><rect x=\"1160\" y=\"496\" width=\"360\" height=\"229\" rx=\"18\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1185.00\" y=\"546.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">外部进程与服务<\/text><text x=\"1185.00\" y=\"599.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">主线 / reviewer<\/text><text x=\"1185.00\" y=\"633.50\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">共享 MCP / 远端服务<\/text><text x=\"1185.00\" y=\"668.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">由原所有者管理<\/text><text x=\"80.00\" y=\"789.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">关键实测：一个 worker 超限时，其他任务继续；控制面仍能查询和受理取消。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  运行架构<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">运行拓扑：把控制余量与执行预算分开<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">S 是常驻服务边界；C 放控制进程；每次 worker 执行拥有独立资源组。<\/text><rect x=\"1322.0\" y=\"35\" width=\"198.0\" height=\"33\" rx=\"8\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1334.00\" y=\"56.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 拓扑 / H · 主机验证<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#1D4244\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：P / S / C 的关系；进程资源所有权；目标主机探针<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">22 / 36<\/text><\/svg>"}, {"title": "并行安全还取决于共享写入与配置生效范围", "section": "运行架构", "notes": "共享资源优先使用任务独立命名空间或专用实例，必须共享写入时才采用明确协调。项目登记规范 resource_id 以及读写需求，调度在一笔事务中取得完整资源集合、worker 槽与总预算；任一项不足就全不取得，避免部分占有后互等。共享副作用只能在取得 claim 后开始。\n\n进程闭合且远端副作用核清后才能释放 claim；超时、缺心跳或重启不会自动释放未知持有。内部协调只覆盖遵守同一声明的参与者，不自动发现任意原生 shell 的未声明写入，外部 reviewer 必须使用独立资源或遵守同一外部协调合同。\n\nWorkerSlot 管理可变准入状态，ExecutionConfig 是不可变执行内容，TaskResourceOverride 只影响下次执行。enabled 接新任务；draining 拒绝新绑定但保留旧任务返修接续；disabled 让旧任务明确等待，不隐式取消。减少槽位不强杀，也不静默换模型。", "sources": [{"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 172, "short": "固定配置 / 槽位 / 覆盖"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 200, "short": "共享资源准入"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"并行安全还取决于共享写入与配置生效范围\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"240\" width=\"700\" height=\"263\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"263\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"295.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">共享资源：先声明，再取得全部占用<\/text><text x=\"105.00\" y=\"355.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">优先使用任务独立命名空间。<\/text><text x=\"105.00\" y=\"395.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">共享写入使用明确独占声明。<\/text><text x=\"105.00\" y=\"436.76\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">槽位、预算与资源一次取得；<\/text><text x=\"105.00\" y=\"477.64\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">未知持有继续核对。<\/text><rect x=\"804\" y=\"240\" width=\"716\" height=\"263\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"804\" y=\"263\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#3C7398\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"829.00\" y=\"295.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">配置：区分三个生效范围<\/text><text x=\"829.00\" y=\"355.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">WorkerSlot 管准入；<\/text><text x=\"829.00\" y=\"395.88\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">ExecutionConfig 固定执行内容；<\/text><text x=\"829.00\" y=\"436.76\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"400\">任务资源覆盖只作用下一次执行。<\/text><rect x=\"80\" y=\"541\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"574.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">槽位状态<\/text><text x=\"396.00\" y=\"574.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">新任务<\/text><text x=\"776.00\" y=\"574.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">旧任务返修 / 恢复<\/text><rect x=\"80\" y=\"594\" width=\"1440\" height=\"63\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"632.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">enabled<\/text><text x=\"396.00\" y=\"632.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">可首次绑定<\/text><text x=\"776.00\" y=\"632.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">按原配置取得原槽<\/text><rect x=\"80\" y=\"657\" width=\"1440\" height=\"63\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"695.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">draining<\/text><text x=\"396.00\" y=\"695.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">停止新绑定<\/text><text x=\"776.00\" y=\"695.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">允许旧任务接续，完成后再退役<\/text><rect x=\"80\" y=\"720\" width=\"1440\" height=\"63\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"758.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"700\">disabled<\/text><text x=\"396.00\" y=\"758.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">不可首次绑定<\/text><text x=\"776.00\" y=\"758.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">明确等待，管理员恢复准入后再继续<\/text><text x=\"80.00\" y=\"821.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"22\" font-weight=\"400\">内部声明协调只保证约定范围；共享外部服务和任意未声明写入仍需项目约束。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  运行架构<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">并行安全还取决于共享写入与配置生效范围<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">worktree 解决源码目录分离；端口、数据库、缓存仍需要明确约定。<\/text><rect x=\"1290.0\" y=\"35\" width=\"230.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1302.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 共享资源与配置生命周期<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：固定配置 / 槽位 / 覆盖；共享资源准入<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">23 / 36<\/text><\/svg>"}, {"title": "通知是提醒，持久队列才是工作来源", "section": "协作与通知", "notes": "业务链路在候选发布、终态或重要中断时保存事实及必要 outbox，主线和 reviewer 随时可经 CLI/MCP 查队列。唤醒链路只向已登记的既有根发送短提示，引导读取当前 inbox 和领取；提示不携带完整证据，也不授权任务结果。\n\n旧实现已有 codex queue 适配源码路径，但它只证明旧版本存在此方式，不能证明目标客户端能收到、唤醒空闲根并实际领取。V0 可由用户打开客户端主动查队列；V1 至少验证一种真实消息传输。客户端关闭时不承诺自动启动，根忙碌时依客户端支持方式排队。\n\n发送回执丢失意味着消息可能已经入队，必须保存 uncertain 并核对，不能不断启动新的发送。领取和最终判决使用自己的幂等与租约规则，重复提示不产生重复计分。合并提示减少打扰，但不能抹掉未解决事项或压制新工作。", "sources": [{"path": "docs/design/TASK_AND_REVIEW_PROTOCOL.md", "line": 293, "short": "两条通知链路"}, {"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 243, "short": "V0 / V1 通知范围"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"通知是提醒，持久队列才是工作来源\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"247\" width=\"1440\" height=\"193\" rx=\"18\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"109.00\" y=\"298.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">持久业务链<\/text><text x=\"109.00\" y=\"354.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">候选 / 终态 / 中断事项  →  outbox + inbox  →  主动查询  →  领取与处理<\/text><text x=\"109.00\" y=\"407.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">队列来自已提交业务事实；任务不因提示发送失败而丢失。<\/text><rect x=\"80\" y=\"477\" width=\"1440\" height=\"166\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"108.00\" y=\"526.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">客户端提醒链<\/text><text x=\"108.00\" y=\"581.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">发送提示  →  传输回执  →  根线程实际收件  →  调用 next_review<\/text><text x=\"108.00\" y=\"623.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"400\">每一跳都要单独观察，真实支持能力需在目标客户端验证。<\/text><rect x=\"80\" y=\"683\" width=\"460\" height=\"122\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"728.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">在线且支持<\/text><text x=\"102.00\" y=\"773.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">提示后读取实时队列<\/text><rect x=\"570\" y=\"683\" width=\"460\" height=\"122\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"592.00\" y=\"728.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">离线 / 已关闭<\/text><text x=\"592.00\" y=\"773.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">保留事项，恢复后主动查询<\/text><rect x=\"1060\" y=\"683\" width=\"460\" height=\"122\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1082.00\" y=\"728.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">发送结果未知<\/text><text x=\"1082.00\" y=\"773.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">保留 uncertain，先核对<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  协作与通知<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">通知是提醒，持久队列才是工作来源<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">通知失败仍能主动查询；发送、收件、领取和判决分别记录。<\/text><rect x=\"1256.0\" y=\"35\" width=\"264.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1268.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · 通知目标 / D·H · 客户端路径<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：两条通知链路；V0 / V1 通知范围<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">24 / 36<\/text><\/svg>"}, {"title": "成果能交付，依靠“内容 + 引用 + 保留义务”", "section": "数据架构", "notes": "SQLite 保存任务、分配、执行、判决、通知以及成果归属和引用；Git 与文件保存代码、报告、证据、日志和可恢复工作区。先在私有暂存核验内容并持久发布，再以短事务登记 Candidate、Artifact、阶段和 outbox；目录存在本身不表示候选已经生效。\n\n历史索引长期保留不等于正文永久保留。active_task、dependent_task、delivery、explicit_keep 和未完成发布/备份的 pin 保护需要保留的内容，ReadGuard 保护一次实际读取不被并发删除。回收必须与新引用申请互斥；到期回收留下 expired 元数据，损坏或丢失是另外的完整性事件。未选择期限时默认 retain，不自动到期。\n\n备份需要同时包含一致 DB 快照、承诺保留的 Git/文件和清单；必须在新目录恢复并实际取出成果。恢复旧快照创建新的 store_epoch 与授权代次，使旧游标、凭据、handle、动作和未确认客户端写入失效，避免把旧请求自动重放到更早的历史。恢复备份不能被当作随意覆盖新成果的回退按钮。", "sources": [{"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 5, "short": "存储分工"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 121, "short": "候选发布"}, {"path": "docs/design/RELIABILITY_AND_STORAGE.md", "line": 196, "short": "保留与备份"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"成果能交付，依靠“内容 + 引用 + 保留义务”\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"239\" width=\"700\" height=\"239\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"262\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"294.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">SQLite：可事务提交的事实<\/text><text x=\"105.00\" y=\"353.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">Task / Assignment / Execution / Review<\/text><text x=\"105.00\" y=\"392.42\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">幂等回执、通知、配置、成果索引<\/text><text x=\"105.00\" y=\"431.84\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">统计由这些事实重新计算<\/text><rect x=\"804\" y=\"239\" width=\"716\" height=\"239\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"804\" y=\"262\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"829.00\" y=\"294.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">Git + 文件：可验证的成果正文<\/text><text x=\"829.00\" y=\"353.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">commit 与受保护引用<\/text><text x=\"829.00\" y=\"392.42\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">报告、证据、日志、会话、工作区<\/text><text x=\"829.00\" y=\"431.84\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"400\">内容摘要、成员清单与大小<\/text><rect x=\"80\" y=\"525\" width=\"340\" height=\"180\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"102.00\" y=\"573.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">发布<\/text><text x=\"102.00\" y=\"615.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">暂存核验 → 持久内容<\/text><text x=\"102.00\" y=\"648.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">→ DB 引用与候选生效<\/text><rect x=\"445\" y=\"525\" width=\"340\" height=\"180\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"467.00\" y=\"573.00\" fill=\"#3C7398\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">保留<\/text><text x=\"467.00\" y=\"615.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">活动 / 依赖 / 交付 pins<\/text><text x=\"467.00\" y=\"648.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">+ 传输 ReadGuard<\/text><rect x=\"810\" y=\"525\" width=\"340\" height=\"180\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"832.00\" y=\"573.00\" fill=\"#E76A3B\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">回收<\/text><text x=\"832.00\" y=\"615.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">到期且义务闭合<\/text><text x=\"832.00\" y=\"648.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">保留摘要与过期事实<\/text><rect x=\"1175\" y=\"525\" width=\"340\" height=\"180\" rx=\"14\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1197.00\" y=\"573.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"30\" font-weight=\"700\">恢复<\/text><text x=\"1197.00\" y=\"615.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">DB + Git + 文件清单<\/text><text x=\"1197.00\" y=\"648.60\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">新 epoch 阻止旧写重放<\/text><rect x=\"80\" y=\"746\" width=\"1440\" height=\"62\" rx=\"12\" fill=\"#D9EBE2\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"104.00\" y=\"786.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"26\" font-weight=\"700\">只有索引没有原件，无法完成交付；只有文件没有事务引用，也不等于发布成功。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  数据架构<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">成果能交付，依靠“内容 + 引用 + 保留义务”<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">SQLite 管事实，Git 与文件管正文；工作区、成果和历史索引各有生命周期。<\/text><rect x=\"1324.0\" y=\"35\" width=\"196.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1336.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 存储 / P · 保留期限<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：存储分工；候选发布；保留与备份<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">25 / 36<\/text><\/svg>"}, {"title": "升级时，负责升级的人必须留在服务之外", "section": "运行架构", "notes": "已确认责任是 U 在 S 的停止边界外，按需执行安装、升级和卸载；U 自身程序与 journal 位于不会被此次切换删除的固定环境。首次安装不依赖 daemon，关闭发起终端或停止 S 后仍能按原 operation_id 查询与接续。\n\n候选升级方案在独立最终目录准备新版本，旧服务继续运行；然后建立维护 hold、停止新增工作并排空在途执行和写入。确认整个 S 及后代闭合后，U 取得离线 state lock，一致备份、检查兼容并切换。新版先维护态启动、核任务与引用，通过后只释放此次 hold，保留用户原暂停。lifecycle lock 串行主机变更，state lock 保证业务单写；持久 fence 保护锁交接间隙。\n\n该方案有 API 停机窗口，不承诺 worker 不停的热升级。新版失败时先保全当前数据，只有旧程序兼容当前数据库才可回退代码，不能自动恢复旧备份覆盖切换后写入。V0 只实现最小 U 安装；完整升级与保留数据卸载在 V1。", "sources": [{"path": "docs/PRODUCT_REQUIREMENTS_BASELINE.md", "line": 221, "short": "生命周期要求"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 229, "short": "升级与锁交接"}, {"path": "docs/design/RUNTIME_LIFECYCLE.md", "line": 247, "short": "故障与回退边界"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"升级时，负责升级的人必须留在服务之外\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#102F32\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"235\" width=\"1440\" height=\"91\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"110.00\" y=\"285.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"29\" font-weight=\"700\">U 始终持有同一 operation_id；操作 journal 在 S 停止时仍可查询和接续。<\/text><rect x=\"80\" y=\"379\" width=\"272\" height=\"194\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"100.00\" y=\"430.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">1 准备<\/text><text x=\"100.00\" y=\"481.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">独立版本目录<\/text><text x=\"100.00\" y=\"515.50\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">旧 S 继续运行<\/text><line x1=\"356\" y1=\"475\" x2=\"367\" y2=\"475\" stroke=\"#F1C887\" stroke-width=\"2\"/><polygon points=\"367.00,475.00 356.19,480.22 356.19,469.78\" fill=\"#F1C887\"/><rect x=\"372\" y=\"379\" width=\"272\" height=\"194\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"392.00\" y=\"430.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">2 排空<\/text><text x=\"392.00\" y=\"481.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">维护 hold<\/text><text x=\"392.00\" y=\"515.50\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">核对在途执行<\/text><line x1=\"648\" y1=\"475\" x2=\"659\" y2=\"475\" stroke=\"#F1C887\" stroke-width=\"2\"/><polygon points=\"659.00,475.00 648.19,480.22 648.19,469.78\" fill=\"#F1C887\"/><rect x=\"664\" y=\"379\" width=\"272\" height=\"194\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"684.00\" y=\"430.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">3 停机<\/text><text x=\"684.00\" y=\"481.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">写入屏障<\/text><text x=\"684.00\" y=\"515.50\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">证明 S 闭合<\/text><line x1=\"940\" y1=\"475\" x2=\"951\" y2=\"475\" stroke=\"#F1C887\" stroke-width=\"2\"/><polygon points=\"951.00,475.00 940.19,480.22 940.19,469.78\" fill=\"#F1C887\"/><rect x=\"956\" y=\"379\" width=\"272\" height=\"194\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"976.00\" y=\"430.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">4 切换<\/text><text x=\"976.00\" y=\"481.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">离线锁 + 备份<\/text><text x=\"976.00\" y=\"515.50\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">受支持的迁移<\/text><line x1=\"1232\" y1=\"475\" x2=\"1243\" y2=\"475\" stroke=\"#F1C887\" stroke-width=\"2\"/><polygon points=\"1243.00,475.00 1232.19,480.22 1232.19,469.78\" fill=\"#F1C887\"/><rect x=\"1248\" y=\"379\" width=\"272\" height=\"194\" rx=\"16\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1268.00\" y=\"430.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">5 验证<\/text><text x=\"1268.00\" y=\"481.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">新版维护态<\/text><text x=\"1268.00\" y=\"515.50\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">核对事实与引用<\/text><line x1=\"80\" y1=\"624\" x2=\"664\" y2=\"624\" stroke=\"#ABC8BE\" stroke-width=\"4\"/><line x1=\"664\" y1=\"624\" x2=\"1220\" y2=\"624\" stroke=\"#F1C887\" stroke-width=\"4\"/><line x1=\"1220\" y1=\"624\" x2=\"1520\" y2=\"624\" stroke=\"#ABC8BE\" stroke-width=\"4\"/><text x=\"80.00\" y=\"670.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">旧服务可继续使用<\/text><text x=\"871.00\" y=\"670.00\" fill=\"#F1C887\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">受控停机窗口<\/text><text x=\"1400.00\" y=\"670.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">验证后恢复<\/text><rect x=\"80\" y=\"723\" width=\"1440\" height=\"84\" rx=\"14\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"108.00\" y=\"769.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"27\" font-weight=\"700\">失败保全：保留原版、当前数据、备份与操作记录；回退取决于数据兼容和新增写入。<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  运行架构<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">升级时，负责升级的人必须留在服务之外<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">U 管安装、升级、卸载；服务管理器管 S 的日常启动、停止与重启。<\/text><rect x=\"1287.0\" y=\"35\" width=\"233.0\" height=\"33\" rx=\"8\" fill=\"#1D4244\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1299.00\" y=\"56.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">R · U 独立 / D·H · 切换方案<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#1D4244\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：生命周期要求；升级与锁交接；故障与回退边界<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#ABC8BE\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">26 / 36<\/text><\/svg>"}, {"title": "为什么这样做：每个选择都有明确收益与代价", "section": "设计取舍", "notes": "这些选择是当前候选设计，不是宣称某种技术普遍最好。单 daemon 加 SQLite 简化本机部署并支持必要原子事务，代价是单机容量与控制面瓶颈需要量化；原生 harness 薄适配保留成熟工具能力，代价是配置、版本和资源归属需要支持矩阵。\n\n外部 reviewer 避免再托管一套账号和推理生命周期，代价是客户端离线时等待，唤醒能力要实测；不可变任务和候选带来明确评审与统计口径，代价是需求变化时要建立关联新任务。阶段与运行观察分层避免故障误计分，但组合约束仍然复杂，需要系统验收。\n\n独立 U 让 daemon 停止后还有明确的执行与恢复责任，代价是锁交接、资源余量和停机窗口。固定窗口统计减少未完成样本被丢弃造成的偏差，但要等待样本成熟，仍无法完全消除同难度任务差异。选择是否合适，要靠针对这些代价的实验与验收判断。", "sources": [{"path": "docs/design/DECISIONS_AND_EVIDENCE.md", "line": 7, "short": "设计选择独立论证"}, {"path": "docs/SOFTWARE_ARCHITECTURE_PROPOSAL.md", "line": 54, "short": "模块与事务"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"为什么这样做：每个选择都有明确收益与代价\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"233\" width=\"1440\" height=\"53\" rx=\"9\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"266.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">选择<\/text><text x=\"386.00\" y=\"266.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">得到的收益<\/text><text x=\"926.00\" y=\"266.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"23\" font-weight=\"700\">接受的代价 / 必须验证<\/text><rect x=\"80\" y=\"286\" width=\"1440\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"323.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">单 daemon + SQLite<\/text><text x=\"386.00\" y=\"323.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">统一事实；本机部署简单；关键变化可原子提交<\/text><text x=\"926.00\" y=\"323.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">单机容量有限；慢工作必须有界，保护控制响应<\/text><rect x=\"80\" y=\"372\" width=\"1440\" height=\"86\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"409.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">原生 harness 薄适配<\/text><text x=\"386.00\" y=\"409.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">保留 MCP / subagent / shell 与原生迭代<\/text><text x=\"926.00\" y=\"409.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">版本、配置、relay 与子进程归属需要实测<\/text><rect x=\"80\" y=\"458\" width=\"1440\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"495.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">外部独立 reviewer<\/text><text x=\"386.00\" y=\"495.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">职责清楚；复用已有客户端与独立根<\/text><text x=\"926.00\" y=\"495.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">客户端离线会等待；提示到实际领取需验收<\/text><rect x=\"80\" y=\"544\" width=\"1440\" height=\"86\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"581.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">冻结合同与候选<\/text><text x=\"386.00\" y=\"581.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">返修问题不漂移；证据、判决和统计可追溯<\/text><text x=\"926.00\" y=\"581.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">需求变化需新任务；引用与保留管理更严格<\/text><rect x=\"80\" y=\"630\" width=\"1440\" height=\"86\" rx=\"0\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"667.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">独立 U + 停机切换<\/text><text x=\"386.00\" y=\"667.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">S 停止后仍有执行者；操作可接续<\/text><text x=\"926.00\" y=\"667.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">需要锁与 fence；有停机窗口；回退受数据约束<\/text><rect x=\"80\" y=\"716\" width=\"1440\" height=\"86\" rx=\"0\" fill=\"#EAEDE5\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"96.00\" y=\"753.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"700\">成熟窗口 + 随机探索<\/text><text x=\"386.00\" y=\"753.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">未完成任务不从分母消失；新模型有取样机会<\/text><text x=\"926.00\" y=\"753.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"24\" font-weight=\"400\">等待样本成熟；相关表现仍非纯因果能力<\/text><text x=\"80.00\" y=\"58.00\" fill=\"#127C72\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"18\" font-weight=\"700\">AGENTD  /  设计取舍<\/text><text x=\"80.00\" y=\"139.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"48\" font-weight=\"700\">为什么这样做：每个选择都有明确收益与代价<\/text><text x=\"82.00\" y=\"191.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">用足够的机制兑现边界，避免让主线承担运行系统的内部步骤。<\/text><rect x=\"1402.0\" y=\"35\" width=\"118.0\" height=\"33\" rx=\"8\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1414.00\" y=\"56.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"16\" font-weight=\"700\">D · 方案论证<\/text><line x1=\"80\" y1=\"837\" x2=\"1520\" y2=\"837\" stroke=\"#D6DED6\" stroke-width=\"1\"/><text x=\"80.00\" y=\"866.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"14\" font-weight=\"400\">依据：设计选择独立论证；模块与事务<\/text><text x=\"1451.00\" y=\"868.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"19\" font-weight=\"700\">27 / 36<\/text><\/svg>"}, {"title": "验收的单位：同一条真实用户旅程", "section": "验证与交付", "notes": "首要旅程是使用真实发布目录和最小 U 完成安装，经 Dashboard 配置，主线提交真实任务，worker 交付代码或报告，外部 reviewer 独立审核，主线实际读出成果。服务健康、页面展示或 CLI 可启动都只是局部证据。\n\n进一步必须验证第一轮和第三轮 PASS、第三次 REJECT、重复请求和迟到判决，证明唯一终态和计数；三个真实 worker 至少两种模型重叠工作，其中一个超限时另两个仍可交付；保留进度并在 daemon 重启后显式接续；独立副本与自有审核证据；原始字节和长中文目标不截断；完整备份在新目录实际恢复。\n\n每条结果标记源码版本、实际程序路径、主机、客户端、模型配置和证据。目标故障必须先被证明成功注入，才能声称隔离通过。离线合同、真实模型、真实客户端和目标主机分开记录；缺一层就保留 NOT RUN。V1 的通知、学习和升级按其阶段验收。", "sources": [{"path": "docs/design/VALIDATION_PLAN.md", "line": 5, "short": "验收顺序"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 25, "short": "工作包"}, {"path": "docs/design/VALIDATION_PLAN.md", "line": 79, "short": "C01–C16 补充验收"}], "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 1600 900\" role=\"img\" aria-label=\"验收的单位：同一条真实用户旅程\"><rect x=\"0\" y=\"0\" width=\"1600\" height=\"900\" rx=\"0\" fill=\"#F5F3EC\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"235\" width=\"1440\" height=\"103\" rx=\"16\" fill=\"#173331\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"108.00\" y=\"290.00\" fill=\"#FFFFFF\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"31\" font-weight=\"700\">U 安装 → 页面配置 → 主线提交 → 真实 worker → 外部独审 → 实际取回成果<\/text><rect x=\"80\" y=\"370\" width=\"464\" height=\"191\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"393\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"422.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">终态唯一<\/text><text x=\"105.00\" y=\"482.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">首轮 / 第三轮 PASS；三拒绝停止；<\/text><text x=\"105.00\" y=\"518.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">重复请求不重计。<\/text><rect x=\"568\" y=\"370\" width=\"464\" height=\"191\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"568\" y=\"393\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"593.00\" y=\"422.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">真实并行<\/text><text x=\"593.00\" y=\"482.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">3 worker、至少 2 模型；一个超限，<\/text><text x=\"593.00\" y=\"518.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">其他任务继续。<\/text><rect x=\"1056\" y=\"370\" width=\"464\" height=\"191\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"1056\" y=\"393\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#3C7398\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"1081.00\" y=\"422.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">中断可继续<\/text><text x=\"1081.00\" y=\"482.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">工作区保留；旧执行核清；原会话或<\/text><text x=\"1081.00\" y=\"518.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">新会话接手。<\/text><rect x=\"80\" y=\"584\" width=\"464\" height=\"191\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"80\" y=\"607\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#127C72\" stroke=\"none\" stroke-width=\"1.5\"/><text x=\"105.00\" y=\"636.00\" fill=\"#173331\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"28\" font-weight=\"700\">材料完整<\/text><text x=\"105.00\" y=\"696.00\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">长中文验收、原始字节、独立副本、<\/text><text x=\"105.00\" y=\"732.50\" fill=\"#647874\" font-family=\"Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif\" font-size=\"25\" font-weight=\"400\">分段证据齐全。<\/text><rect x=\"568\" y=\"584\" width=\"464\" height=\"191\" rx=\"18\" fill=\"#FFFFFF\" stroke=\"none\" stroke-width=\"1.5\"/><rect x=\"568\" y=\"607\" width=\"5\" height=\"37\" rx=\"2\" fill=\"#E76A3B\" stroke=\"none\"
